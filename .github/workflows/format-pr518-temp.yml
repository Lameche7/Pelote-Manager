name: Format PR 518 source files (temporary)
on:
  push:
    branches:
      - fix/admin-score-unprogrammed-tournament-matches
    paths:
      - .github/workflows/format-pr518-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier settings
        run: |
          ./node_modules/.bin/prettier --write src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx src/features/admin/tournaments/services/adminTournamentUnprogrammedService.ts
      - name: Commit formatting only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx src/features/admin/tournaments/services/adminTournamentUnprogrammedService.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier to unprogrammed score correction'
            git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:fix/admin-score-unprogrammed-tournament-matches
          fi
