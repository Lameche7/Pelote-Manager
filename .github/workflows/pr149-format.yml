name: PR149 format

on:
  push:
    branches:
      - agent/licence-renewal

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/licence-renewal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format licence files
        run: >-
          npx prettier --write
          src/features/admin/members/pages/AdminLicencesPage.tsx
          src/features/licences/pages/MyLicencePage.tsx
          src/features/licences/services/licenceService.ts
          tests/licenceRequests.test.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/members/pages/AdminLicencesPage.tsx \
            src/features/licences/pages/MyLicencePage.tsx \
            src/features/licences/services/licenceService.ts \
            tests/licenceRequests.test.mjs
          git diff --cached --quiet || git commit -m "style(licences): appliquer Prettier"
          git push origin HEAD:agent/licence-renewal
