name: PR125 Errebot preview retry 2

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install pdfjs-dist --save

      - name: Recover generation and navigation scripts
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          def extract(path: str, start_name: str, next_name: str, destination: str):
              source = Path(path).read_text(encoding="utf-8")
              pattern = (
                  rf"      - name: {re.escape(start_name)}\n"
                  rf"        shell: (?:bash|python)\n"
                  rf"        run: \|\n"
                  rf"(?P<body>.*?)"
                  rf"(?=\n      - name: {re.escape(next_name)}|\n      - run:)"
              )
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f"Unable to recover {start_name}")
              Path(destination).write_text(textwrap.dedent(match.group("body")), encoding="utf-8")

          extract(
              ".github/workflows/pr125-errebot-preview-codemod.yml",
              "Add local PDF extraction and preview",
              "Wire the assistant into admin navigation",
              "/tmp/pr125-add-preview.sh",
          )
          extract(
              ".github/workflows/pr125-errebot-preview-retry.yml",
              "Wire the assistant into admin navigation",
              "Run npx prettier --write src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs package.json package-lock.json",
              "/tmp/pr125-wire-preview.py",
          )

      - run: bash /tmp/pr125-add-preview.sh
      - run: python /tmp/pr125-wire-preview.py

      - name: Align PDF.js API and preview test
        shell: python
        run: |
          from pathlib import Path

          extraction = Path("src/features/admin/tournaments/domain/errebotPdfExtraction.ts")
          text = extraction.read_text(encoding="utf-8")
          old = "await document.destroy();"
          new = "await loadingTask.destroy();"
          if text.count(old) != 1:
              raise SystemExit("PDF.js cleanup anchor not found exactly once")
          extraction.write_text(text.replace(old, new), encoding="utf-8")

          test_file = Path("tests/tournamentErrebotImportPreview.test.mjs")
          text = test_file.read_text(encoding="utf-8")
          old = "characterCount: 37,"
          new = "characterCount: 38,"
          if text.count(old) != 1:
              raise SystemExit("Preview character-count assertion anchor not found exactly once")
          test_file.write_text(text.replace(old, new), encoding="utf-8")

      - run: npx prettier --write src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs package.json package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified preview assistant and clean one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs
          git rm .github/workflows/pr125-errebot-preview-codemod.yml .github/workflows/pr125-errebot-preview-retry.yml .github/workflows/pr125-errebot-preview-retry2.yml
          git commit -m "feat(tournaments): preview Errebot PDFs locally"
          git push origin HEAD:agent/errebot-import-foundation
