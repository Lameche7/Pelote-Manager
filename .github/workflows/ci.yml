name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche PR76
        uses: actions/checkout@v4
        with:
          ref: agent/tournament-planning-engine
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Afficher une pastille pour chaque match du tournoi complet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/features/admin/tournaments/pages/AdminTournamentPlanningPage.tsx")
          source = path.read_text()
          pattern = re.compile(
              r'''\{dayRows\s*\.slice\(0,\s*6\)\s*\.map\(\(row\)\s*=>\s*renderEvent\(row,\s*true\)\)\}\s*\{dayRows\.length\s*>\s*6\s*&&\s*\(\s*<span className="planning-calendar__more">.*?</span>\s*\)\}''',
              re.S,
          )
          source, count = pattern.subn(
              '{dayRows.map((row) => renderEvent(row, true))}',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Tournament overview block not found")
          path.write_text(source)
          PY
          npx prettier --write src/features/admin/tournaments/pages/AdminTournamentPlanningPage.tsx

      - name: Restaurer la CI standard
        run: |
          git fetch origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Enregistrer la vue globale finale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/pages/AdminTournamentPlanningPage.tsx .github/workflows/ci.yml
          git commit -m "style(tournaments): show every match in tournament overview"
          git push origin HEAD:agent/tournament-planning-engine
