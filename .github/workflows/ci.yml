name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formater le test PR80
        run: npx prettier --write tests/reservationPolicyV2.test.mjs

      - name: Exporter le test formaté
        uses: actions/upload-artifact@v4
        with:
          name: pr80-reservation-policy-prettier
          path: tests/reservationPolicyV2.test.mjs

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
