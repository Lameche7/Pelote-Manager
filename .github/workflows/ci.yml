name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formater les fichiers PR81
        run: >-
          npx prettier --write
          public/sw.js
          src/features/notifications/components/PushNotificationSettings.tsx
          src/features/notifications/services/pushNotificationService.ts
          supabase/functions/push-config/index.ts
          supabase/functions/send-push-notifications/index.ts
          tests/pushNotifications.test.mjs

      - name: Exporter les fichiers formatés
        uses: actions/upload-artifact@v4
        with:
          name: pr81-prettier
          path: |
            public/sw.js
            src/features/notifications/components/PushNotificationSettings.tsx
            src/features/notifications/services/pushNotificationService.ts
            supabase/functions/push-config/index.ts
            supabase/functions/send-push-notifications/index.ts
            tests/pushNotifications.test.mjs

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
