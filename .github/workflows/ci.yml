name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formater les fichiers PR80
        run: >-
          npx prettier --write
          src/features/user-space/profile/pages/MyProfilePage.tsx
          tests/reservationPolicyV2.test.mjs

      - name: Exporter les fichiers formatés PR80
        uses: actions/upload-artifact@v4
        with:
          name: pr80-prettier
          path: |
            src/features/user-space/profile/pages/MyProfilePage.tsx
            tests/reservationPolicyV2.test.mjs

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
