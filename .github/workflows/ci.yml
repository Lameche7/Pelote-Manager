name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formater les fichiers PR79
        run: >-
          npx prettier --write
          src/features/user-space/dashboard/pages/UserSpaceDashboardPage.tsx
          src/features/user-space/tournaments/pages/MyTournamentsPage.css
          src/features/user-space/tournaments/pages/MyTournamentsPage.tsx
          tests/userTournaments.test.mjs

      - name: Exporter les fichiers formatés PR79
        uses: actions/upload-artifact@v4
        with:
          name: pr79-prettier
          path: |
            src/features/user-space/dashboard/pages/UserSpaceDashboardPage.tsx
            src/features/user-space/tournaments/pages/MyTournamentsPage.css
            src/features/user-space/tournaments/pages/MyTournamentsPage.tsx
            tests/userTournaments.test.mjs

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
