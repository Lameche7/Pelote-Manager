name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formater le test du tableau de bord
        run: npx prettier --write tests/adminDashboard.test.mjs

      - name: Exporter le test formaté
        uses: actions/upload-artifact@v4
        with:
          name: pr57-dashboard-test
          path: tests/adminDashboard.test.mjs
