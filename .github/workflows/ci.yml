name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier l'absence de secrets suivis par Git
        run: npm run security:secrets

      - run: npm ci

      - name: Format workflow
        run: npx prettier --check .github/workflows/ci.yml
        continue-on-error: true
      - name: Format README
        run: npx prettier --check README.md
        continue-on-error: true
      - name: Format package
        run: npx prettier --check package.json
        continue-on-error: true
      - name: Format ignore files
        run: npx prettier --check .gitignore .prettierignore
        continue-on-error: true
      - name: Format migration
        run: npx prettier --check supabase/migrations/20260728000100_add_profile_role.sql
        continue-on-error: true
      - name: Format routes
        run: npx prettier --check src/app/router/ProtectedRoute.tsx src/app/router/protectedRouteAccess.ts
        continue-on-error: true
      - name: Format admin
        run: npx prettier --check src/features/admin/pages/AdminPage.tsx
        continue-on-error: true
      - name: Format infrastructure
        run: npx prettier --check src/infrastructure/auth/authService.ts src/infrastructure/profile/profileMappers.ts src/infrastructure/profile/profileService.ts src/infrastructure/supabase/database.ts
        continue-on-error: true
      - name: Format shared
        run: npx prettier --check src/shared/config/index.ts src/shared/config/roles.ts src/shared/types/auth.ts src/shared/types/profile.ts
        continue-on-error: true
      - name: Format tests
        run: npx prettier --check tests/protectedRouteAccess.test.mjs tests/roles.test.mjs tsconfig.test.json
        continue-on-error: true

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diagnostic exact du formatage de l'éditeur
        run: npx prettier src/features/admin/club/pages/PlatformClubInformationEditor.tsx | diff -u src/features/admin/club/pages/PlatformClubInformationEditor.tsx - || true
      - run: npm run format:check

  network-user-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/networkClubUserAdmin.test.mjs tests/adminAccessHardening.test.mjs

  sql-network-user-admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le schéma isolé et valider la migration SQL
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/network-user-admin-fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f supabase/migrations/20261008211000_scope_admin_profiles_to_club.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/network-user-admin-cases.sql

  multiclub-isolation:
    name: Isolation entre clubs (PostgreSQL éphémère)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer la fixture fictive (deux clubs)
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/network-user-admin-fixture.sql
      - name: Appliquer la véritable migration des droits multi-club
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f supabase/migrations/20261008211000_scope_admin_profiles_to_club.sql
      - name: Vérifier lecture, écriture et absence d'accès inter-club
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/multiclub-isolation-cases.sql

  platform-admin-lease-sql:
    name: Autorisations super-admin (PostgreSQL éphémère)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer le schéma fictif
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/network-user-admin-fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/platform-admin-lease-fixture.sql
      - name: Appliquer la migration en base éphémère
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/platform-admin-short-lived-leases.draft.sql
      - name: Tester les permissions et la révocation
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/platform-admin-lease-cases.sql

  dashboard-multiclub-sql:
    name: Tableau de bord multi-clubs (PostgreSQL éphémère)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Installer les clubs fictifs et les droits de plateforme
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/network-user-admin-fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/platform-admin-lease-fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/platform-admin-short-lived-leases.draft.sql
      - name: Installer les surcharges expérimentales du tableau de bord
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/admin-dashboard-club-overloads.draft.sql
      - name: Vérifier les refus d'accès inter-clubs
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/admin-dashboard-club-overloads-cases.sql
      - name: Installer les données fictives du tableau de bord
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/admin-dashboard-authorized-fixture.sql
      - name: Vérifier les lectures autorisées de chaque club
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f tests/sql/admin-dashboard-authorized-cases.sql

  formatting-user-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vérifier uniquement les fichiers applicatifs du correctif
        run: npx prettier --check src/features/admin/pages/AdminUsersPage.tsx tests/networkClubUserAdmin.test.mjs tests/adminAccessHardening.test.mjs

  build-user-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
