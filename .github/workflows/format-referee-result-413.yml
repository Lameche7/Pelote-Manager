name: Format PR 413
on:
  push:
    branches: [fix/referee-result-confirmation-20261024]
    paths:
      - '.github/workflows/format-referee-result-413.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/refereeing/pages/RefereeingPage.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-referee-result-413.yml
          git add src/features/refereeing/pages/RefereeingPage.tsx
          git commit -m "style: format referee result confirmation"
          git push
