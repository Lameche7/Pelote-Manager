name: Format PR139

on:
  push:
    branches:
      - agent/championship-official-standings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-official-standings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          api/championship-general-standings-source.mjs
          src/features/admin/championships/components/ChampionshipStandingsImportCard.tsx
          src/features/user-space/championships/pages/MyChampionshipsPage.tsx
          src/features/user-space/championships/services/myChampionshipRankingContextService.ts
          tests/championshipStandingsImport.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/championship-general-standings-source.mjs \
            src/features/admin/championships/components/ChampionshipStandingsImportCard.tsx \
            src/features/user-space/championships/pages/MyChampionshipsPage.tsx \
            src/features/user-space/championships/services/myChampionshipRankingContextService.ts \
            tests/championshipStandingsImport.test.mjs
          git commit -m "chore: format PR139 ranking changes"
          git push origin HEAD:agent/championship-official-standings
