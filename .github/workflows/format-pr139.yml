name: Format PR139

on:
  push:
    branches:
      - agent/championship-official-standings

permissions:
  contents: write

jobs:
  prettier:
    if: github.event.head_commit.message != 'chore: apply prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/championship-official-standings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format affected files
        run: |
          npx prettier --write \
            api/championship-standings-source.mjs \
            src/features/admin/championships/components/ChampionshipResultSettingsCard.tsx \
            src/features/admin/championships/components/ChampionshipStandingsImportCard.tsx \
            src/features/admin/championships/domain/championshipStandingsImport.ts \
            src/features/user-space/championships/services/myChampionshipResultSettingsService.ts \
            src/features/user-space/championships/services/myChampionshipsService.ts \
            tests/championshipResultSettings.test.mjs \
            tests/championshipStandingsImport.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/championship-standings-source.mjs \
            src/features/admin/championships/components/ChampionshipResultSettingsCard.tsx \
            src/features/admin/championships/components/ChampionshipStandingsImportCard.tsx \
            src/features/admin/championships/domain/championshipStandingsImport.ts \
            src/features/user-space/championships/services/myChampionshipResultSettingsService.ts \
            src/features/user-space/championships/services/myChampionshipsService.ts \
            tests/championshipResultSettings.test.mjs \
            tests/championshipStandingsImport.test.mjs
          git commit -m "chore: apply prettier formatting"
          git push origin HEAD:agent/championship-official-standings
