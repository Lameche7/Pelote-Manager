name: PR125 Errebot preview codemod

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install pdfjs-dist --save

      - name: Add local PDF extraction and preview
        shell: bash
        run: |
          mkdir -p src/features/admin/tournaments/domain
          mkdir -p src/features/admin/tournaments/pages

          cat > src/features/admin/tournaments/domain/errebotImportPreview.ts <<'EOF'
          export const ERREBOT_PDF_LIMITS = {
            maxBytes: 20 * 1024 * 1024,
            previewLines: 80,
          } as const;

          export type ErrebotPdfSelection = {
            name: string;
            size: number;
            type: string;
          };

          export type ErrebotExtractionPreview = {
            pageCount: number;
            characterCount: number;
            lineCount: number;
            excerpt: string;
            truncated: boolean;
          };

          export const validateErrebotPdfSelection = (
            file: ErrebotPdfSelection,
          ): string | null => {
            if (file.size <= 0) return "Le fichier PDF est vide.";
            if (file.size > ERREBOT_PDF_LIMITS.maxBytes) {
              return "Le fichier dépasse la limite de 20 Mo.";
            }
            if (!file.name.toLowerCase().endsWith(".pdf")) {
              return "Sélectionnez un fichier PDF Errebot.";
            }
            if (file.type && file.type !== "application/pdf") {
              return "Le type du fichier sélectionné n’est pas un PDF.";
            }
            return null;
          };

          export const normalizeExtractedPdfText = (value: string) =>
            value
              .replace(/\u00a0/g, " ")
              .split(/\r?\n/)
              .map((line) => line.replace(/[\t ]+/g, " ").trim())
              .filter(Boolean)
              .join("\n");

          export const buildErrebotExtractionPreview = (
            value: string,
            pageCount: number,
          ): ErrebotExtractionPreview => {
            const normalized = normalizeExtractedPdfText(value);
            const lines = normalized ? normalized.split("\n") : [];
            const excerptLines = lines.slice(0, ERREBOT_PDF_LIMITS.previewLines);
            return {
              pageCount: Math.max(0, Math.floor(pageCount)),
              characterCount: normalized.length,
              lineCount: lines.length,
              excerpt: excerptLines.join("\n"),
              truncated: lines.length > excerptLines.length,
            };
          };

          export const formatErrebotFileSize = (size: number) => {
            if (size < 1024) return `${size} octets`;
            if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} Ko`;
            return `${(size / (1024 * 1024)).toFixed(1)} Mo`;
          };
          EOF

          cat > src/features/admin/tournaments/domain/errebotPdfExtraction.ts <<'EOF'
          export type ExtractedErrebotPdf = {
            pageCount: number;
            text: string;
          };

          export const sha256File = async (file: File) => {
            const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
            return [...new Uint8Array(digest)]
              .map((byte) => byte.toString(16).padStart(2, "0"))
              .join("");
          };

          export const extractErrebotPdfText = async (
            file: File,
          ): Promise<ExtractedErrebotPdf> => {
            const [{ getDocument, GlobalWorkerOptions }, workerModule] =
              await Promise.all([
                import("pdfjs-dist"),
                import("pdfjs-dist/build/pdf.worker.min.mjs?url"),
              ]);

            GlobalWorkerOptions.workerSrc = workerModule.default;

            const loadingTask = getDocument({
              data: new Uint8Array(await file.arrayBuffer()),
            });
            const document = await loadingTask.promise;
            const pages: string[] = [];

            try {
              for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
                const page = await document.getPage(pageNumber);
                const content = await page.getTextContent();
                const text = content.items
                  .flatMap((item) => ("str" in item ? [item.str] : []))
                  .join(" ")
                  .replace(/[\t ]+/g, " ")
                  .trim();
                pages.push(text);
              }
            } finally {
              await document.destroy();
            }

            return {
              pageCount: pages.length,
              text: pages.join("\n"),
            };
          };
          EOF

          cat > src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx <<'EOF'
          import { useState } from "react";
          import {
            buildErrebotExtractionPreview,
            formatErrebotFileSize,
            validateErrebotPdfSelection,
            type ErrebotExtractionPreview,
          } from "@/features/admin/tournaments/domain/errebotImportPreview";
          import {
            extractErrebotPdfText,
            sha256File,
          } from "@/features/admin/tournaments/domain/errebotPdfExtraction";
          import "./AdminTournamentImportPage.css";

          type SelectedPdf = {
            file: File;
            hash: string;
          };

          const steps = ["Fichier", "Contrôle", "Prévisualisation"] as const;

          export function AdminTournamentImportPage() {
            const [selected, setSelected] = useState<SelectedPdf | null>(null);
            const [preview, setPreview] = useState<ErrebotExtractionPreview | null>(null);
            const [step, setStep] = useState(1);
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState("");

            const reset = () => {
              setSelected(null);
              setPreview(null);
              setError("");
              setStep(1);
            };

            const selectFile = async (file: File) => {
              setError("");
              setPreview(null);
              const validationError = validateErrebotPdfSelection(file);
              if (validationError) {
                setError(validationError);
                return;
              }

              setBusy(true);
              try {
                const hash = await sha256File(file);
                setSelected({ file, hash });
                setStep(2);
              } catch (cause) {
                setError(
                  cause instanceof Error
                    ? cause.message
                    : "Impossible de contrôler le fichier PDF.",
                );
              } finally {
                setBusy(false);
              }
            };

            const analyse = async () => {
              if (!selected) return;
              setBusy(true);
              setError("");
              try {
                const extracted = await extractErrebotPdfText(selected.file);
                const nextPreview = buildErrebotExtractionPreview(
                  extracted.text,
                  extracted.pageCount,
                );
                if (nextPreview.characterCount === 0) {
                  setError(
                    "Aucun texte exploitable n’a été extrait. Le PDF est peut-être scanné sous forme d’image.",
                  );
                  return;
                }
                setPreview(nextPreview);
                setStep(3);
              } catch (cause) {
                setError(
                  cause instanceof Error
                    ? cause.message
                    : "Impossible d’extraire le texte du PDF Errebot.",
                );
              } finally {
                setBusy(false);
              }
            };

            return (
              <section className="admin-page admin-tournament-import">
                <header className="admin-page__header">
                  <div>
                    <p className="admin-page__eyebrow">Tournois · Errebot</p>
                    <h1>Importer un tournoi</h1>
                    <p className="admin-page__lead">
                      Contrôlez le PDF Errebot et vérifiez son extraction avant toute
                      création dans Pelote Manager. À cette étape, le document reste
                      uniquement dans votre navigateur.
                    </p>
                  </div>
                </header>

                <ol className="admin-tournament-import__steps" aria-label="Étapes de l’import">
                  {steps.map((label, index) => (
                    <li
                      key={label}
                      className={step === index + 1 ? "is-active" : ""}
                    >
                      <span>{index + 1}</span>
                      {label}
                    </li>
                  ))}
                </ol>

                {error && (
                  <p className="admin-tournament-import__alert" role="alert">
                    {error}
                  </p>
                )}

                {step === 1 && (
                  <div className="admin-card admin-tournament-import__card">
                    <div>
                      <h2>Choisir le PDF Errebot</h2>
                      <p>
                        Le fichier est lu localement. Aucun PDF ni texte extrait
                        n’est envoyé au serveur pendant ce contrôle.
                      </p>
                    </div>
                    <label className="admin-tournament-import__file">
                      Fichier PDF
                      <input
                        type="file"
                        accept=".pdf,application/pdf"
                        disabled={busy}
                        onChange={(event) => {
                          const file = event.target.files?.[0];
                          if (file) void selectFile(file);
                        }}
                      />
                    </label>
                    <small>20 Mo maximum.</small>
                  </div>
                )}

                {step === 2 && selected && (
                  <div className="admin-card admin-tournament-import__card">
                    <div>
                      <h2>Contrôle du fichier</h2>
                      <p>
                        L’empreinte permet de reconnaître exactement ce fichier sans
                        stocker son contenu.
                      </p>
                    </div>
                    <dl className="admin-tournament-import__metadata">
                      <div>
                        <dt>Nom</dt>
                        <dd>{selected.file.name}</dd>
                      </div>
                      <div>
                        <dt>Taille</dt>
                        <dd>{formatErrebotFileSize(selected.file.size)}</dd>
                      </div>
                      <div>
                        <dt>SHA-256</dt>
                        <dd className="admin-tournament-import__hash">{selected.hash}</dd>
                      </div>
                    </dl>
                    <div className="admin-tournament-import__actions">
                      <button type="button" disabled={busy} onClick={reset}>
                        Changer de fichier
                      </button>
                      <button
                        type="button"
                        className="admin-tournament-import__primary"
                        disabled={busy}
                        onClick={() => void analyse()}
                      >
                        {busy ? "Extraction en cours…" : "Extraire et prévisualiser"}
                      </button>
                    </div>
                  </div>
                )}

                {step === 3 && selected && preview && (
                  <>
                    <div className="admin-card admin-tournament-import__summary">
                      <div>
                        <strong>{preview.pageCount}</strong>
                        <span>page{preview.pageCount > 1 ? "s" : ""}</span>
                      </div>
                      <div>
                        <strong>{preview.lineCount}</strong>
                        <span>lignes utiles</span>
                      </div>
                      <div>
                        <strong>{preview.characterCount}</strong>
                        <span>caractères extraits</span>
                      </div>
                    </div>

                    <div className="admin-card admin-tournament-import__card">
                      <div>
                        <h2>Prévisualisation de l’extraction</h2>
                        <p>
                          Vérifiez que les équipes, poules et informations du tournoi
                          sont lisibles. Cette zone peut contenir des données
                          personnelles : elle reste locale et n’est pas enregistrée.
                        </p>
                      </div>
                      <pre className="admin-tournament-import__preview">
                        {preview.excerpt}
                      </pre>
                      {preview.truncated && (
                        <small>
                          Aperçu limité aux 80 premières lignes utiles. Le texte
                          complet reste disponible en mémoire pour l’analyse suivante.
                        </small>
                      )}
                      <div className="admin-tournament-import__actions">
                        <button type="button" onClick={reset}>
                          Tester un autre PDF
                        </button>
                      </div>
                    </div>
                  </>
                )}
              </section>
            );
          }
          EOF

          cat > src/features/admin/tournaments/pages/AdminTournamentImportPage.css <<'EOF'
          .admin-tournament-import {
            display: grid;
            gap: 1rem;
          }

          .admin-tournament-import__steps {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.65rem;
            margin: 0;
            padding: 0;
            list-style: none;
          }

          .admin-tournament-import__steps li {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            border: 1px solid rgb(107 114 128 / 18%);
            border-radius: 0.85rem;
            padding: 0.7rem 0.8rem;
            background: #fff;
            font-weight: 750;
            opacity: 0.62;
          }

          .admin-tournament-import__steps li span {
            display: grid;
            place-items: center;
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 999px;
            background: rgb(107 114 128 / 10%);
            font-size: 0.78rem;
          }

          .admin-tournament-import__steps li.is-active {
            border-color: var(--club-accent, #1e5aa8);
            box-shadow: inset 0 0 0 1px var(--club-accent, #1e5aa8);
            opacity: 1;
          }

          .admin-tournament-import__card {
            display: grid;
            gap: 1rem;
          }

          .admin-tournament-import__card h2,
          .admin-tournament-import__card p {
            margin: 0;
          }

          .admin-tournament-import__card p {
            margin-top: 0.3rem;
            opacity: 0.7;
          }

          .admin-tournament-import__file {
            display: grid;
            gap: 0.45rem;
            max-width: 32rem;
            font-weight: 800;
          }

          .admin-tournament-import__file input {
            box-sizing: border-box;
            width: 100%;
            border: 1px dashed rgb(107 114 128 / 40%);
            border-radius: 0.75rem;
            padding: 0.8rem;
            background: rgb(255 255 255 / 75%);
          }

          .admin-tournament-import__alert {
            margin: 0;
            border-radius: 0.8rem;
            padding: 0.75rem 0.9rem;
            color: #8b1f1f;
            background: rgb(178 37 37 / 10%);
            font-weight: 750;
          }

          .admin-tournament-import__metadata {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            margin: 0;
          }

          .admin-tournament-import__metadata > div {
            display: grid;
            gap: 0.2rem;
            border-radius: 0.7rem;
            padding: 0.7rem;
            background: rgb(107 114 128 / 6%);
          }

          .admin-tournament-import__metadata > div:last-child {
            grid-column: 1 / -1;
          }

          .admin-tournament-import__metadata dt {
            font-size: 0.7rem;
            font-weight: 850;
            text-transform: uppercase;
            opacity: 0.58;
          }

          .admin-tournament-import__metadata dd {
            margin: 0;
          }

          .admin-tournament-import__hash {
            overflow-wrap: anywhere;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
              "Liberation Mono", monospace;
            font-size: 0.78rem;
          }

          .admin-tournament-import__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.55rem;
          }

          .admin-tournament-import__primary {
            font-weight: 850;
          }

          .admin-tournament-import__summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
          }

          .admin-tournament-import__summary > div {
            display: grid;
            gap: 0.15rem;
            text-align: center;
          }

          .admin-tournament-import__summary strong {
            font-size: 1.35rem;
          }

          .admin-tournament-import__summary span {
            font-size: 0.75rem;
            opacity: 0.64;
          }

          .admin-tournament-import__preview {
            max-height: 30rem;
            margin: 0;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid rgb(107 114 128 / 16%);
            border-radius: 0.75rem;
            padding: 0.9rem;
            background: rgb(15 23 42 / 4%);
            font: 0.78rem/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
              "Liberation Mono", monospace;
          }

          @media (max-width: 760px) {
            .admin-tournament-import__steps,
            .admin-tournament-import__summary,
