          EOF

          cat > tests/tournamentErrebotImportPreview.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            buildErrebotExtractionPreview,
            normalizeExtractedPdfText,
            validateErrebotPdfSelection,
          } from "../.test-dist/src/features/admin/tournaments/domain/errebotImportPreview.js";

          test("la selection Errebot accepte uniquement un PDF raisonnable", () => {
            assert.equal(
              validateErrebotPdfSelection({
                name: "tournoi-errebot.pdf",
                size: 1_024,
                type: "application/pdf",
              }),
              null,
            );
            assert.match(
              validateErrebotPdfSelection({
                name: "tournoi.txt",
                size: 1_024,
                type: "text/plain",
              }),
              /PDF/,
            );
            assert.match(
              validateErrebotPdfSelection({
                name: "tournoi.pdf",
                size: 21 * 1024 * 1024,
                type: "application/pdf",
              }),
              /20 Mo/,
            );
          });

          test("la previsualisation nettoie le texte sans inventer de donnees", () => {
            const source = "  Tournoi test  \n\nPoule A\t  Équipe 1\n Équipe 2  ";
            assert.equal(
              normalizeExtractedPdfText(source),
              "Tournoi test\nPoule A Équipe 1\nÉquipe 2",
            );
            assert.deepEqual(buildErrebotExtractionPreview(source, 2), {
              pageCount: 2,
              characterCount: 37,
              lineCount: 3,
              excerpt: "Tournoi test\nPoule A Équipe 1\nÉquipe 2",
              truncated: false,
            });
          });
          EOF

      - name: Wire the assistant into admin navigation
        shell: python
        run: |
          from pathlib import Path

          routes = Path("src/shared/config/routes.ts")
          text = routes.read_text(encoding="utf-8")
          old = '  adminTournaments: "/admin/tournois",\n  adminTournamentTeams: "/admin/tournois/equipes",'
          new = '  adminTournaments: "/admin/tournois",\n  adminTournamentImport: "/admin/tournois/importer",\n  adminTournamentTeams: "/admin/tournois/equipes",'
          if text.count(old) != 1:
            raise SystemExit("routes.ts anchor not found exactly once")
          routes.write_text(text.replace(old, new), encoding="utf-8")

          permissions = Path("src/features/admin/config/adminPermissions.ts")
          text = permissions.read_text(encoding="utf-8")
          old = '''      {
                label: "Gestion des tournois",
                to: ROUTES.adminTournaments,
                permission: ADMIN_PERMISSIONS.tournaments,
              },
              {
                label: "Équipes & inscriptions",'''
          new = '''      {
                label: "Gestion des tournois",
                to: ROUTES.adminTournaments,
                permission: ADMIN_PERMISSIONS.tournaments,
              },
              {
                label: "Importer Errebot",
                to: ROUTES.adminTournamentImport,
                permission: ADMIN_PERMISSIONS.tournaments,
              },
              {
                label: "Équipes & inscriptions",'''
          if text.count(old) != 1:
            raise SystemExit("adminPermissions.ts anchor not found exactly once")
          permissions.write_text(text.replace(old, new), encoding="utf-8")

          router = Path("src/app/router.tsx")
          text = router.read_text(encoding="utf-8")
          old = 'import { AdminTournamentPlanningPage } from "@/features/admin/tournaments/pages/AdminTournamentPlanningPage";\n'
          new = 'import { AdminTournamentImportPage } from "@/features/admin/tournaments/pages/AdminTournamentImportPage";\n' + old
          if text.count(old) != 1:
            raise SystemExit("router import anchor not found exactly once")
          text = text.replace(old, new)

          old = '''          {
                    path: "tournois/equipes",
                    element: permitted(
                      ADMIN_PERMISSIONS.tournaments,
                      <AdminTournamentTeamsPage />,
                    ),
                  },'''
          new = '''          {
                    path: "tournois/importer",
                    element: permitted(
                      ADMIN_PERMISSIONS.tournaments,
                      <AdminTournamentImportPage />,
                    ),
                  },
                  {
                    path: "tournois/equipes",
                    element: permitted(
                      ADMIN_PERMISSIONS.tournaments,
                      <AdminTournamentTeamsPage />,
                    ),
                  },'''
          if text.count(old) != 1:
            raise SystemExit("router route anchor not found exactly once")
          router.write_text(text.replace(old, new), encoding="utf-8")

      - run: npx prettier --write src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs package.json package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified preview assistant and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs
          git rm .github/workflows/pr125-errebot-preview-codemod.yml
          git commit -m "feat(tournaments): preview Errebot PDFs locally"
          git push origin HEAD:agent/errebot-import-foundation
