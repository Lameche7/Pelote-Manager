name: PR127 format final availability

on:
  push:
    branches:
      - agent/tournament-rescheduling
    paths:
      - .github/workflows/pr127-format-final-availability.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tournament-rescheduling

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: |
          npx prettier --write src/features/admin/tournaments/components/AdminErrebotAvailabilityImport.tsx src/features/admin/tournaments/domain/errebotAvailabilityImport.ts src/features/admin/tournaments/services/adminErrebotAvailabilityImportService.ts src/features/admin/tournaments/services/errebotAvailabilityWorkbookService.ts tests/tournamentErrebotAvailabilityImport.test.mjs
          rm .github/workflows/pr127-format-final-availability.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(tournaments): format final availability correction" || exit 0
          git push origin HEAD:agent/tournament-rescheduling
