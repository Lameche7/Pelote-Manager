name: Temporary formatting PR 552
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/calendar-final-stage-labels-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format regression test
        run: npx prettier --write tests/calendarFinalsDirectPlanning.test.mjs
      - name: Commit formatting and remove workflow
        run: |
          git rm .github/workflows/temporary-format-pr552.yml
          git add tests/calendarFinalsDirectPlanning.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format calendar knockout stage regression test'
          git push origin HEAD:feature/calendar-final-stage-labels-20261118
