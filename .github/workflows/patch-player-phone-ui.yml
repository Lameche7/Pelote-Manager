name: Patch player phone UI

on:
  push:
    branches:
      - feat/player-phone-contacts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-phone-contacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch_player_phone_ui.py
      - run: npx prettier --write src/features/user-space/tournaments/pages/MyTournamentsPage.tsx src/features/user-space/tournaments/pages/MyTournamentsPage.css src/features/user-space/championships/pages/MyChampionshipsPage.tsx src/features/user-space/championships/pages/MyChampionshipsPage.css tests/playerPhoneContacts.test.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/user-space/tournaments/pages/MyTournamentsPage.tsx src/features/user-space/tournaments/pages/MyTournamentsPage.css src/features/user-space/championships/pages/MyChampionshipsPage.tsx src/features/user-space/championships/pages/MyChampionshipsPage.css tests/playerPhoneContacts.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(contacts): show player phone numbers"
          git push origin HEAD:feat/player-phone-contacts
