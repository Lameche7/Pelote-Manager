name: PR125 format priority publication

on:
  push:
    branches:
      - agent/errebot-import-foundation
    paths:
      - .github/workflows/pr125-format-priority-publication.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format priority publication files
        run: npx prettier --write src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx tests/tournamentPublicationPriority.test.mjs
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/pr125-format-priority-publication.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx tests/tournamentPublicationPriority.test.mjs .github/workflows/pr125-format-priority-publication.yml
          git commit -m "style(tournaments): format priority publication"
          git push origin HEAD:agent/errebot-import-foundation
