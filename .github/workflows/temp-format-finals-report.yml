name: Temporary report formatter
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/temp-format-finals-report.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/championship-finals-sync-report-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/championships/pages/AdminChampionshipResultsPage.tsx supabase/functions/championship-official-sync/index.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/championships/pages/AdminChampionshipResultsPage.tsx supabase/functions/championship-official-sync/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format final sync report"
          git pull --rebase origin feat/championship-finals-sync-report-20261019
          git push origin HEAD:feat/championship-finals-sync-report-20261019
