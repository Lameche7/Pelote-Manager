name: Temporary PR135 wiring

on:
  push:
    branches:
      - agent/championship-source-import

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-source-import
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/router.tsx")
          text = path.read_text()
          import_anchor = 'import { AdminCommunicationPage } from "@/features/admin/communication/pages/AdminCommunicationPage";\n'
          import_line = 'import { AdminChampionshipImportPage } from "@/features/admin/championships/pages/AdminChampionshipImportPage";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("router import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          route_anchor = '''          {
            path: "communication",
            element: permitted(
              ADMIN_PERMISSIONS.communication,
              <AdminCommunicationPage />,
            ),
          },
'''
          route_block = '''          {
            path: "championnats/importer",
            element: permitted(
              ADMIN_PERMISSIONS.championships,
              <AdminChampionshipImportPage />,
            ),
          },
'''
          if route_block not in text:
              if route_anchor not in text:
                  raise SystemExit("router route anchor not found")
              text = text.replace(route_anchor, route_block + route_anchor, 1)
          path.write_text(text)
          PY
      - run: npx prettier --write src/app/router.tsx src/features/admin/config/adminPermissions.ts src/shared/config/routes.ts src/features/admin/championships/domain/championshipSourceImport.ts src/features/admin/championships/services/championshipSourceFileService.ts src/features/admin/championships/pages/AdminChampionshipImportPage.tsx src/features/admin/championships/pages/AdminChampionshipImportPage.css tests/championshipSourceImport.test.mjs tsconfig.test.json
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx src/features/admin/config/adminPermissions.ts src/shared/config/routes.ts src/features/admin/championships tests/championshipSourceImport.test.mjs tsconfig.test.json
          git commit -m "feat(championship): wire import preview in admin"
          git push
