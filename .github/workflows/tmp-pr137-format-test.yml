name: Temporary PR137 test format

on:
  push:
    branches:
      - agent/championship-player-dashboard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-player-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/myChampionships.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/myChampionships.test.mjs
          git commit -m "style(championship): format player dashboard tests"
          git push
