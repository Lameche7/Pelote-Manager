name: PR127 format reschedule preview

on:
  push:
    branches:
      - agent/tournament-rescheduling
    paths:
      - .github/workflows/pr127-format-reschedule-preview.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tournament-rescheduling

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format PR127 files
        run: >-
          npx prettier --write
          src/features/user-space/tournaments/components/TournamentRescheduleSuggestions.css
          src/features/user-space/tournaments/components/TournamentRescheduleSuggestions.tsx
          src/features/user-space/tournaments/services/tournamentRescheduleService.ts
          tests/tournamentRescheduleSuggestions.test.mjs

      - name: Remove helper workflow
        run: rm .github/workflows/pr127-format-reschedule-preview.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/user-space/tournaments/components/TournamentRescheduleSuggestions.css src/features/user-space/tournaments/components/TournamentRescheduleSuggestions.tsx src/features/user-space/tournaments/services/tournamentRescheduleService.ts tests/tournamentRescheduleSuggestions.test.mjs .github/workflows/pr127-format-reschedule-preview.yml
          git commit -m "style(tournaments): format reschedule preview"
          git push origin HEAD:agent/tournament-rescheduling
