name: Temporary Prettier apply

on:
  push:
    branches:
      - agent/external-identity-account-link

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format auth files
        run: |
          npx prettier --write \
            src/features/auth/pages/LoginPage.tsx \
            src/features/auth/pages/RegisterPage.tsx \
            src/features/auth/services/externalParticipationService.ts
          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/auth/pages/RegisterPage.tsx")
          content = path.read_text()
          old = "<span>🥋</span>"
          new = "<span>🪪</span>"
          if old not in content:
              raise SystemExit("Licence icon marker not found")
          path.write_text(content.replace(old, new, 1))
          PY
          npx prettier --write src/features/auth/pages/RegisterPage.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/auth/pages/LoginPage.tsx \
            src/features/auth/pages/RegisterPage.tsx \
            src/features/auth/services/externalParticipationService.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style(auth): format account registration flow"
          git push
