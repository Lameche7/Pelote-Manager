name: Temporary Pilotoki hero formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-hero-photo.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-photo-real-logo-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/network/assets/pilotokiHeroPhoto.ts src/features/network/pages/NetworkDirectoryPage.tsx src/features/network/pages/NetworkDirectoryPage.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/network
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Pilotoki hero"
          git pull --rebase origin feat/hero-photo-real-logo-20261020
          git push origin HEAD:feat/hero-photo-real-logo-20261020
