name: Temporary PR131 format

on:
  push:
    branches:
      - agent/profile-identity-links

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-identity-links
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format PR131 files
        run: |
          npx prettier --write \
            src/features/user-space/profile/pages/MyProfilePage.tsx \
            tests/profileIdentityLinks.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/user-space/profile/pages/MyProfilePage.tsx tests/profileIdentityLinks.test.mjs
          git diff --cached --quiet || git commit -m "style(profile): format identity linking flow"
          git push
