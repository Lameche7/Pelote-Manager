name: Sauvegarde manuelle chiffrée Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Sauvegarde PostgreSQL chiffrée
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-backup
    steps:
      - name: Vérifier les secrets nécessaires
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Secret SUPABASE_BACKUP_DATABASE_URL absent"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Secret SUPABASE_BACKUP_PASSPHRASE absent"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 24 || { echo "::error::Phrase secrète trop courte (24 caractères minimum)"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$BACKUP_PASSPHRASE"

      - name: Vérifier la connexion PostgreSQL sans exposer les identifiants
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Diagnostic : démarrage de la vérification PostgreSQL"
          ERR="$(mktemp)"
          trap 'rm -f "$ERR"' EXIT
          if docker run --rm --env DATABASE_URL postgres:17 \
            sh -c 'exec psql "$DATABASE_URL" -X -q -t -A -v ON_ERROR_STOP=1 -c "SELECT 1"' \
            > /dev/null 2> "$ERR"; then
            echo "Diagnostic : connexion PostgreSQL réussie"
          else
            if grep -Eqi 'password authentication failed|invalid password|authentication failed' "$ERR"; then
              echo "::error::Authentification PostgreSQL refusée : vérifier le nom utilisateur et le mot de passe dans le secret."
            elif grep -Eqi 'tenant or user not found|unknown tenant|invalid user' "$ERR"; then
              echo "::error::Session pooler : utilisateur ou identifiant de projet non reconnu."
            elif grep -Eqi 'could not translate host name|name or service not known|nodename nor servname' "$ERR"; then
              echo "::error::Nom du serveur Session pooler introuvable."
            elif grep -Eqi 'connection refused|timeout expired|timed out|network is unreachable|no route to host' "$ERR"; then
              echo "::error::Connexion réseau au serveur PostgreSQL impossible."
            elif grep -Eqi 'database .* does not exist' "$ERR"; then
              echo "::error::Nom de base PostgreSQL incorrect."
            elif grep -Eqi 'no pg_hba.conf entry|SSL off|SSL required' "$ERR"; then
              echo "::error::Connexion SSL refusée."
            else
              echo "::error::Connexion PostgreSQL impossible (cause non classée). Aucun secret n'a été affiché."
            fi
            exit 1
          fi

      - name: Exporter et chiffrer sans publier le fichier brut
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/pilotoki-backup"
          RAW="$RUNNER_TEMP/pilotoki-backup/database.dump"
          ENCRYPTED="$RUNNER_TEMP/pilotoki-backup/pilotoki-production.dump.enc"
          trap 'rm -f "$RAW"' EXIT
          # Capture stderr privately. Never print connection strings or secrets.
          ERR="$RUNNER_TEMP/pilotoki-backup/pg_dump.stderr"
          trap 'rm -f "$RAW" "$ERR"' EXIT
          if ! docker run --rm \
            --env DATABASE_URL \
            postgres:17 \
            sh -c 'exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=-' > "$RAW" 2> "$ERR"; then
            if grep -Eqi 'password authentication failed|invalid password|authentication failed' "$ERR"; then
              echo "::error::Connexion PostgreSQL refusée : vérifier utilisateur et mot de passe du secret GitHub."
            elif grep -Eqi 'could not translate host name|name or service not known|nodename nor servname' "$ERR"; then
              echo "::error::Hôte PostgreSQL introuvable : vérifier le serveur Session pooler dans l’URL."
            elif grep -Eqi 'connection refused|timeout expired|timed out|network is unreachable|no route to host' "$ERR"; then
              echo "::error::Serveur PostgreSQL inaccessible : vérifier l’hôte, le port et le mode Session pooler."
            elif grep -Eqi 'permission denied|must be owner|insufficient privilege|row-level security' "$ERR"; then
              echo "::error::Permissions PostgreSQL insuffisantes pour la sauvegarde."
            elif grep -Eqi 'server version mismatch|aborting because of server version mismatch' "$ERR"; then
              echo "::error::Version du client pg_dump incompatible avec le serveur PostgreSQL."
            elif grep -Eqi 'role .* does not exist|user .* does not exist' "$ERR"; then
              echo "::error::Utilisateur PostgreSQL inconnu : vérifier le nom du compte de sauvegarde."
            elif grep -Eqi 'database .* does not exist' "$ERR"; then
              echo "::error::Base PostgreSQL introuvable : vérifier le nom de base dans l’URL."
            elif grep -Eqi 'no pg_hba.conf entry|SSL off|SSL required' "$ERR"; then
              echo "::error::Connexion SSL refusée : vérifier les paramètres de connexion Supabase."
            else
              echo "::error::Échec pg_dump non classé. Le journal brut est volontairement masqué pour protéger les secrets."
            fi
            exit 1
          fi
          echo "Diagnostic : export terminé, vérification de la taille du fichier"
          test -s "$RAW" || { echo "::error::Export vide"; exit 1; }
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in "$RAW" -out "$ENCRYPTED" -pass env:BACKUP_PASSPHRASE
          echo "Diagnostic : chiffrement terminé"
          test -s "$ENCRYPTED" || { echo "::error::Fichier chiffré vide"; exit 1; }
          # Verify the encrypted file can be decrypted and parsed without
          # leaving a second plaintext dump on disk.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in "$ENCRYPTED" -pass env:BACKUP_PASSPHRASE | docker run --rm -i postgres:17 pg_restore --list >/dev/null
          sha256sum "$ENCRYPTED" > "$ENCRYPTED.sha256"
          rm -f "$RAW"
          echo "Sauvegarde chiffrée vérifiée ; aucune restauration effectuée."

      - name: Publier uniquement la sauvegarde chiffrée
        uses: actions/upload-artifact@v4
        with:
          name: pilotoki-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pilotoki-backup/pilotoki-production.dump.enc
            ${{ runner.temp }}/pilotoki-backup/pilotoki-production.dump.enc.sha256
          if-no-files-found: error
          retention-days: 3
