name: Temporary format tournament availability

on:
  push:
    branches:
      - feat/tournament-availability-controls

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/features/tournaments/components/TournamentRegistrationForm.tsx \
            src/features/tournaments/services/tournamentService.ts \
            tests/tournamentFinalsAvailabilityMinimum.test.mjs
          rm .github/workflows/tmp-format-tournament-availability.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: formater les disponibilités tournoi"
          git push
