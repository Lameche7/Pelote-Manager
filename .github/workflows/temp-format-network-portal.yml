name: Temporary network portal formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-network-portal.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/network-as-main-website-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx src/app/router.tsx tests/marketingDomainSplit.test.mjs
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/router.tsx tests/marketingDomainSplit.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format network site routing"
          git pull --rebase origin feat/network-as-main-website-20261020
          git push origin HEAD:feat/network-as-main-website-20261020
