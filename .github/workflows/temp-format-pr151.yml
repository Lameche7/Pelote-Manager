name: Temp format PR151

on:
  push:
    branches:
      - agent/championship-reservation-priority

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-reservation-priority
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/features/admin/championships/pages/AdminChampionshipReservationsPage.tsx
          tests/championshipReservationPriority.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/championships/pages/AdminChampionshipReservationsPage.tsx tests/championshipReservationPriority.test.mjs
          git commit -m "style: appliquer Prettier à PR151"
          git push origin HEAD:agent/championship-reservation-priority
