name: PR125 format prestart rankings

on:
  push:
    branches:
      - agent/errebot-import-foundation
    paths:
      - .github/workflows/pr125-format-prestart-rankings.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format ranking component
        run: npx prettier --write src/features/tournaments/components/TournamentRankings.tsx

      - name: Remove helper workflow
        run: rm .github/workflows/pr125-format-prestart-rankings.yml

      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournaments/components/TournamentRankings.tsx .github/workflows/pr125-format-prestart-rankings.yml
          git commit -m "style(tournaments): format prestart rankings"
          git push origin HEAD:agent/errebot-import-foundation
