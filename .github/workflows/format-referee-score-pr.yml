name: Format referee score PR
on:
  push:
    branches: [feat/referee-simple-score-dialog]
    paths:
      - '.github/workflows/format-referee-score-pr.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/refereeing/pages/RefereeingPage.tsx src/features/refereeing/pages/RefereeingPage.css
      - name: Commit formatter result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-referee-score-pr.yml
          git add src/features/refereeing/pages/RefereeingPage.tsx src/features/refereeing/pages/RefereeingPage.css
          git commit -m "style(refereeing): apply Prettier formatting"
          git push
