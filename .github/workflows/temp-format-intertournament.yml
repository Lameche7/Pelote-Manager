name: One-time intertournament formatting
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-intertournament.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intertournament-registration-conflicts-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize code
        run: |
          npx prettier --write src/features/tournaments/components/TournamentAvailabilityGrid.tsx src/features/tournaments/components/TournamentRegistrationForm.tsx src/features/tournaments/services/tournamentService.ts
          npx prettier --check src/features/tournaments/components/TournamentAvailabilityGrid.tsx src/features/tournaments/components/TournamentRegistrationForm.tsx src/features/tournaments/services/tournamentService.ts
          git diff --check
      - name: Push formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournaments/components/TournamentAvailabilityGrid.tsx src/features/tournaments/components/TournamentRegistrationForm.tsx src/features/tournaments/services/tournamentService.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format intertournament registration checks"
          git pull --rebase origin feat/intertournament-registration-conflicts-20261016
          git push origin HEAD:feat/intertournament-registration-conflicts-20261016
