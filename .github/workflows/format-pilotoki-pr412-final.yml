name: Finish PR 412 formatting
on:
  push:
    branches: [feat/referee-simple-score-dialog]
    paths:
      - '.github/workflows/format-pilotoki-pr412-final.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/refereeing/pages/RefereeingPage.tsx src/features/reservations/services/calendarCompetitionService.ts
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pilotoki-pr412-final.yml
          git add src/features/refereeing/pages/RefereeingPage.tsx src/features/reservations/services/calendarCompetitionService.ts
          git commit -m "style: format final two files"
          git push
