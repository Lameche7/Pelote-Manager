name: Temporary formatting PR 553
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/final-day-order-live-calendar-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prettier changed files
        run: |
          npx prettier --write \
            src/features/admin/tournaments/components/AdminTournamentFinalDayLineup.tsx \
            src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx \
            src/features/admin/tournaments/pages/AdminTournamentQualificationPage.css \
            src/features/reservations/components/SlotCard.tsx \
            src/features/reservations/pages/ReservationLockedSlots.css \
            tests/calendarFinalsDirectPlanning.test.mjs
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-format-pr553.yml
          git add src/features/admin/tournaments/components/AdminTournamentFinalDayLineup.tsx src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx src/features/admin/tournaments/pages/AdminTournamentQualificationPage.css src/features/reservations/components/SlotCard.tsx src/features/reservations/pages/ReservationLockedSlots.css tests/calendarFinalsDirectPlanning.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format finals running order UI'
          git push origin HEAD:feature/final-day-order-live-calendar-20261118
