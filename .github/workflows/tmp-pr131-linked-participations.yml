name: Temporary PR131 linked participations

on:
  push:
    branches:
      - agent/profile-identity-links

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-identity-links
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update profile participations view
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/features/user-space/profile/pages/MyProfilePage.tsx")
          text = page.read_text()
          text = text.replace(
              '  const [candidates, setCandidates] = useState<\n    ExternalParticipationCandidate[]\n  >([]);',
              '  const [candidates, setCandidates] = useState<\n    ExternalParticipationCandidate[]\n  >([]);\n  const [linkedParticipations, setLinkedParticipations] = useState<\n    ExternalParticipationCandidate[]\n  >([]);',
          )
          text = text.replace(
              '    setCandidates([]);\n\n    if (profileFirstName.length < 2 || profileLastName.length < 2) {',
              '    setCandidates([]);\n    setLinkedParticipations([]);\n\n    if (profileFirstName.length < 2 || profileLastName.length < 2) {',
          )
          text = text.replace(
              '      const found = await externalParticipationService.find(\n        profileFirstName,\n        profileLastName,\n      );\n      setCandidates(found);\n      if (found.length === 0) {\n        setActionMessage(\n          "Aucune nouvelle participation à rattacher n’a été trouvée avec votre nom et votre prénom.",\n        );\n      }',
              '      const [found, linked] = await Promise.all([\n        externalParticipationService.find(profileFirstName, profileLastName),\n        externalParticipationService.listLinked(),\n      ]);\n      setCandidates(found);\n      setLinkedParticipations(linked);\n      if (found.length === 0 && linked.length === 0) {\n        setActionMessage(\n          "Aucune participation n’a été trouvée avec votre compte pour le moment.",\n        );\n      }',
          )
          text = text.replace(
              '      setCandidates((current) =>\n        current.filter(\n          (item) => item.externalIdentityId !== candidate.externalIdentityId,\n        ),\n      );\n      setActionMessage(',
              '      const linked = await externalParticipationService.listLinked();\n      setCandidates((current) =>\n        current.filter(\n          (item) => item.externalIdentityId !== candidate.externalIdentityId,\n        ),\n      );\n      setLinkedParticipations(linked);\n      setActionMessage(',
          )
          text = text.replace(
              '              {searchingParticipations ? (\n                <p role="status">Recherche de vos participations…</p>\n              ) : candidates.length > 0 ? (\n                <div className="my-profile__participations">\n                  {candidates.map((candidate) => (',
              '              {searchingParticipations ? (\n                <p role="status">Recherche de vos participations…</p>\n              ) : (\n                <>\n                  {linkedParticipations.length > 0 && (\n                    <div className="my-profile__participation-section">\n                      <h4>Déjà rattachées à votre compte</h4>\n                      <div className="my-profile__participations">\n                        {linkedParticipations.map((candidate) => (\n                          <article\n                            className="my-profile__participation--linked"\n                            key={`linked-${candidate.externalIdentityId}-${candidate.tournamentId}-${candidate.teamId}`}\n                          >\n                            <span>Participation rattachée</span>\n                            <strong>{candidate.tournamentName}</strong>\n                            <p>{candidate.seriesName}</p>\n                            <p>{partnerLabel(candidate)}</p>\n                            <small>Poste : {roleLabel(candidate)}</small>\n                            <b>✓ Rattachée à ce compte</b>\n                          </article>\n                        ))}\n                      </div>\n                    </div>\n                  )}\n\n                  {candidates.length > 0 && (\n                    <div className="my-profile__participation-section">\n                      <h4>Nouvelles participations à confirmer</h4>\n                      <div className="my-profile__participations">\n                        {candidates.map((candidate) => (',
          )
          text = text.replace(
              '                  ))}\n                </div>\n              ) : (\n                <p className="my-profile__empty">\n                  Aucune participation non rattachée n’est disponible pour le\n                  moment.\n                </p>\n              )}',
              '                        ))}\n                      </div>\n                    </div>\n                  )}\n\n                  {linkedParticipations.length > 0 && candidates.length === 0 && (\n                    <p className="my-profile__empty">\n                      Toutes les participations trouvées sont déjà rattachées à votre compte.\n                    </p>\n                  )}\n\n                  {linkedParticipations.length === 0 && candidates.length === 0 && (\n                    <p className="my-profile__empty">\n                      Aucune participation n’est disponible pour le moment.\n                    </p>\n                  )}\n                </>\n              )}',
          )
          page.write_text(text)

          css = Path("src/features/user-space/profile/pages/MyProfilePage.css")
          css_text = css.read_text() + '''\n.my-profile__participation-section + .my-profile__participation-section {\n  margin-top: 1rem;\n}\n.my-profile__participation-section h4 {\n  margin: 0 0 0.65rem;\n  color: var(--brand-green);\n}\n.my-profile__participation--linked {\n  border-color: var(--brand-green) !important;\n}\n.my-profile__participation--linked b {\n  color: var(--brand-green);\n  font-size: 0.82rem;\n}\n'''
          css.write_text(css_text)

          test_file = Path("tests/profileIdentityLinks.test.mjs")
          test_text = test_file.read_text()
          test_text += '''\n\ntest("Mon profil distingue les participations déjà rattachées des nouvelles", async () => {\n  const [profilePage, externalParticipationService] = await Promise.all([\n    readFile(profilePageUrl, "utf8"),\n    readFile(externalParticipationServiceUrl, "utf8"),\n  ]);\n\n  assert.match(profilePage, /Déjà rattachées à votre compte/);\n  assert.match(profilePage, /Nouvelles participations à confirmer/);\n  assert.match(profilePage, /Toutes les participations trouvées sont déjà rattachées/);\n  assert.match(profilePage, /externalParticipationService\\.listLinked/);\n  assert.match(externalParticipationService, /get_my_external_participations/);\n});\n'''
          test_file.write_text(test_text)
          PY
          npx prettier --write \
            src/features/user-space/profile/pages/MyProfilePage.tsx \
            src/features/user-space/profile/pages/MyProfilePage.css \
            src/features/auth/services/externalParticipationService.ts \
            tests/profileIdentityLinks.test.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/user-space/profile/pages/MyProfilePage.tsx src/features/user-space/profile/pages/MyProfilePage.css src/features/auth/services/externalParticipationService.ts tests/profileIdentityLinks.test.mjs
          git diff --cached --quiet || git commit -m "fix(profile): show already linked participations"
          git push
