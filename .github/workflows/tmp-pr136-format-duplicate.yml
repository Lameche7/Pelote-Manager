name: Temporary PR136 duplicate guard format

on:
  push:
    branches:
      - agent/championship-incremental-updates

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-incremental-updates
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/championships/services/championshipImportService.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/championships/services/championshipImportService.ts
          git commit -m "style(championship): format duplicate guard client"
          git push
