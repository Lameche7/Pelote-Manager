name: Temporary PR137 wiring

on:
  push:
    branches:
      - agent/championship-player-dashboard

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-player-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/router.tsx')
          text = path.read_text()
          import_anchor = 'import { MyReservationsPage } from "@/features/reservations/pages/MyReservationsPage";\n'
          import_line = 'import { MyChampionshipsPage } from "@/features/user-space/championships/pages/MyChampionshipsPage";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('router import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line)
          route_anchor = '''      {\n        path: ROUTES.myTournaments,\n        element: (\n          <ProtectedRoute allowedRoles={allAuthenticatedRoles}>\n            <MyTournamentsPage />\n          </ProtectedRoute>\n        ),\n      },\n'''
          route_block = route_anchor + '''      {\n        path: ROUTES.myChampionships,\n        element: (\n          <ProtectedRoute allowedRoles={allAuthenticatedRoles}>\n            <MyChampionshipsPage />\n          </ProtectedRoute>\n        ),\n      },\n'''
          if 'path: ROUTES.myChampionships' not in text:
              if route_anchor not in text:
                  raise SystemExit('router route anchor not found')
              text = text.replace(route_anchor, route_block)
          path.write_text(text)
          PY
      - name: Format PR137 files
        run: |
          npx prettier --write \
            src/app/router.tsx \
            src/shared/config/routes.ts \
            src/features/user-space/components/UserSpaceShell.tsx \
            src/features/user-space/dashboard/pages/UserSpaceDashboardPage.tsx \
            src/features/user-space/championships/services/myChampionshipsService.ts \
            src/features/user-space/championships/pages/MyChampionshipsPage.tsx \
            src/features/user-space/championships/pages/MyChampionshipsPage.css \
            supabase/migrations/20260906183000_add_my_championships.sql
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx src/shared/config/routes.ts src/features/user-space/components/UserSpaceShell.tsx src/features/user-space/dashboard/pages/UserSpaceDashboardPage.tsx src/features/user-space/championships supabase/migrations/20260906183000_add_my_championships.sql
          git commit -m "feat(championship): wire player dashboard"
          git push
