name: PR125 format Errebot reconfigure

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/features/admin/tournaments/services/errebotImportService.ts
          tests/tournamentErrebotPublishedReconfiguration.test.mjs
      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/pr125-format-errebot-reconfigure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(tournaments): format Errebot reconfiguration"
          git push origin HEAD:agent/errebot-import-foundation
