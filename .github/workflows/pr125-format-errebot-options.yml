name: PR125 format Errebot tournament options

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Errebot option files
        run: >-
          npx prettier --write
          src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx
          src/features/admin/tournaments/domain/errebotTransactionalImport.ts
          src/features/admin/tournaments/services/errebotImportService.ts
          tests/tournamentErrebotImportOptions.test.mjs
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/pr125-format-errebot-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx src/features/admin/tournaments/domain/errebotTransactionalImport.ts src/features/admin/tournaments/services/errebotImportService.ts tests/tournamentErrebotImportOptions.test.mjs .github/workflows/pr125-format-errebot-options.yml
          git commit -m "style(tournaments): format Errebot tournament options"
          git push
