name: PR125 format identity review

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format identity review files
        run: >-
          npx prettier --write
          src/features/admin/tournaments/components/ErrebotIdentityReview.tsx
          src/features/admin/tournaments/domain/errebotIdentityMatching.ts

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr125-format-identity-review.yml
          git add \
            src/features/admin/tournaments/components/ErrebotIdentityReview.tsx \
            src/features/admin/tournaments/domain/errebotIdentityMatching.ts
          git commit -m "style(tournaments): format Errebot identity review"
          git push origin HEAD:agent/errebot-import-foundation
