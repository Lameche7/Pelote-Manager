name: One-time reservation championship format
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-reservation-championship.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-convert-reservation-championship-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/reservations/pages/AdminReservationsManagementPage.tsx src/features/admin/reservations/services/adminReservationsService.ts
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/reservations/pages/AdminReservationsManagementPage.tsx src/features/admin/reservations/services/adminReservationsService.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format reservation conversion"
          git pull --rebase origin feat/admin-convert-reservation-championship-20261019
          git push origin HEAD:feat/admin-convert-reservation-championship-20261019
