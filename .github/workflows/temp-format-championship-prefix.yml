name: Temporary championship prefix formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-championship-prefix.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/championship-update-prefix-competition-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/championships/pages/AdminChampionshipsPage.tsx src/features/admin/championships/services/championshipSourceFileService.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/championships/pages/AdminChampionshipsPage.tsx src/features/admin/championships/services/championshipSourceFileService.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format championship prefix import"
          git pull --rebase origin fix/championship-update-prefix-competition-20261019
          git push origin HEAD:fix/championship-update-prefix-competition-20261019
