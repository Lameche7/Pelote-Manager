name: Validate read-only FFPB fixture parser
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-verify-final-source.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse official FFPB response in-process (no database write)
        run: |
          node --input-type=module - <<'JS'
          import handler from "./api/championship-results-source.mjs";
          let code = 200;
          let output;
          const response = {
            setHeader: () => {},
            status: (value) => { code=value; return response; },
            json: (payload) => { output=payload; return response; },
          };
          await handler({
            method:"POST",
            body: {
              sourceUrl:"https://lbpb.competition.ffpb.net?id_competition=5",
              seasonLabel:"2025",
              competitionName:"CHAMPIONNAT HIVER 2025",
              specialty:"Trinquet Paleta Pelote de Gomme Pleine Féminine",
              divisions:[{name:"Dames 3ème série"}],
            },
          }, response);
          const fixtures = output?.matches ?? [];
          console.log(JSON.stringify({
            status:code,
            count:fixtures.length,
            results:output?.results?.length,
            phases:[...new Set(fixtures.map(x=>x.phase))],
            warnings:output?.warnings,
            error:output?.error,
          },null,2));
          if (code!==200 || !Array.isArray(output?.matches)) process.exitCode=1;
          JS
