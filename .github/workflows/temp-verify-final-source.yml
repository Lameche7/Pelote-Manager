name: Validate read-only FFPB fixture parser
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-verify-final-source.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ONE official division through preview parser
        env:
          API: https://pelote-manager-ch7ozybr1-guegue-team.vercel.app/api/championship-results-source
        run: |
          curl -fsS --max-time 200 -X POST "$API" -H 'content-type: application/json' \
            -d '{"sourceUrl":"https://lbpb.competition.ffpb.net/FFPB_COMPETITION/PAGE_ACCUEIL_INVITE/qBcAAPNLOQQFAA","seasonLabel":"2027","competitionName":"CHAMPIONNAT HIVER 2027","specialty":"Trinquet Paleta Pelote de Gomme Pleine Féminine","divisions":[{"name":"Dames 3ème série"}]}' > /tmp/ffpb-readonly.json
          node - <<'JS'
          const fs = require("fs");
          const j = JSON.parse(fs.readFileSync("/tmp/ffpb-readonly.json","utf8"));
          const matches = Array.isArray(j.matches) ? j.matches : [];
          const results = Array.isArray(j.results) ? j.results : [];
          const stages = [...new Set(matches.map(m => m.phase))];
          console.log(JSON.stringify({division:j.divisions,matchCount:matches.length,resultCount:results.length,stages,warnings:j.warnings},null,2));
          if (!Array.isArray(j.matches)) process.exitCode=1;
          JS
