name: Temporary formatting PR 548
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/finales-planning-simplifie-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format the six changed files
        run: |
          npx prettier --write \
            src/features/admin/components/AdminBlockedFinalsAlerts.tsx \
            src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx \
            src/features/admin/tournaments/components/AdminTournamentFinalWeeklyOverview.tsx \
            src/features/admin/tournaments/pages/AdminTournamentQualificationPage.tsx \
            src/features/reservations/components/CalendarFinalsAdminPanel.tsx \
            tests/finalStageFullPlanning.test.mjs
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-format-pr548.yml
          git add src/features/admin/components/AdminBlockedFinalsAlerts.tsx src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx src/features/admin/tournaments/components/AdminTournamentFinalWeeklyOverview.tsx src/features/admin/tournaments/pages/AdminTournamentQualificationPage.tsx src/features/reservations/components/CalendarFinalsAdminPanel.tsx tests/finalStageFullPlanning.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format final planning changes with Prettier'
          git push origin HEAD:feature/finales-planning-simplifie-20261118
