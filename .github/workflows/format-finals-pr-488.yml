name: Format finals PR 488
on:
  push:
    branches:
      - feature/tournament-finals-per-series-20261110
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-finals-per-series-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Prettier to files reported by formatting CI
        run: |
          npx prettier --write src/features/admin/pages/AdminPaymentSettingsPage.tsx src/features/admin/tournaments/components/AdminTournamentFinalStageControl.tsx src/features/admin/tournaments/services/tournamentFinalStageAdminService.ts src/features/platform/components/PlatformHelloAssoDiagnosticPanel.tsx src/features/user-space/tournaments/components/MyTournamentFinalBracket.tsx src/features/user-space/tournaments/pages/MyTournamentsPage.tsx supabase/functions/helloasso-oauth-diagnostic/index.ts
      - name: Commit formatted files if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/admin/pages/AdminPaymentSettingsPage.tsx src/features/admin/tournaments/components/AdminTournamentFinalStageControl.tsx src/features/admin/tournaments/services/tournamentFinalStageAdminService.ts src/features/platform/components/PlatformHelloAssoDiagnosticPanel.tsx src/features/user-space/tournaments/components/MyTournamentFinalBracket.tsx src/features/user-space/tournaments/pages/MyTournamentsPage.tsx supabase/functions/helloasso-oauth-diagnostic/index.ts
            git commit -m "style: apply Prettier formatting for PR 488"
            git push origin HEAD:feature/tournament-finals-per-series-20261110
          fi
