name: Format admin manual reschedule files

on:
  push:
    branches:
      - feat/admin-manual-reschedules

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-manual-reschedules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/features/admin/tournaments/components/AdminTournamentManualRescheduleForm.tsx \
            tests/adminManualTournamentReschedule.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/admin/tournaments/components/AdminTournamentManualRescheduleForm.tsx \
            tests/adminManualTournamentReschedule.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(reschedules): apply prettier"
          git push origin HEAD:feat/admin-manual-reschedules

