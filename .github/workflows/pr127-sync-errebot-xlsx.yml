name: PR127 sync Errebot xlsx

on:
  push:
    branches:
      - agent/tournament-rescheduling
    paths:
      - .github/workflows/pr127-sync-errebot-xlsx.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tournament-rescheduling

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update lockfile
        run: npm install --package-lock-only

      - name: Format changed files
        run: |
          npx prettier --write \
            package.json \
            src/features/admin/tournaments/domain/errebotAvailabilityImport.ts \
            src/features/admin/tournaments/services/adminErrebotAvailabilityImportService.ts \
            src/features/admin/tournaments/services/errebotAvailabilityWorkbookService.ts \
            src/features/admin/tournaments/components/AdminErrebotAvailabilityImport.tsx \
            tests/tournamentErrebotAvailabilityImport.test.mjs
          rm .github/workflows/pr127-sync-errebot-xlsx.yml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(tournaments): finalize Errebot xlsx import" || exit 0
          git push origin HEAD:agent/tournament-rescheduling
