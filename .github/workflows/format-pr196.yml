name: Format PR196

on:
  push:
    branches: [feat/championship-match-reservations]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/championship-match-reservations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            .github/workflows/format-pr196.yml \
            src/features/admin/championships/pages/AdminChampionshipReservationsPage.tsx \
            src/features/tv/services/tvDisplayService.ts \
            src/features/user-space/championships/services/championshipMatchReservationService.ts \
            src/features/user-space/championships/services/myChampionshipsService.ts \
            tests/championshipMatchReservations.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-pr196.yml \
            src/features/admin/championships/pages/AdminChampionshipReservationsPage.tsx \
            src/features/tv/services/tvDisplayService.ts \
            src/features/user-space/championships/services/championshipMatchReservationService.ts \
            src/features/user-space/championships/services/myChampionshipsService.ts \
            tests/championshipMatchReservations.test.mjs
          git commit -m "style: format championship match reservation flow"
          git push origin HEAD:feat/championship-match-reservations
