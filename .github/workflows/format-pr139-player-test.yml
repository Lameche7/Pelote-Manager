name: Format PR139 Player Test

on:
  push:
    branches:
      - agent/championship-official-standings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-official-standings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/myChampionships.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/myChampionships.test.mjs
          git commit -m "chore: format player championship test"
          git push origin HEAD:agent/championship-official-standings
