name: PR125 fix confirmation SQL alias

on:
  push:
    branches:
      - agent/errebot-import-foundation
    paths:
      - .github/workflows/pr125-fix-confirmation-sql-alias.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
      - name: Fix reserved SQL alias
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260831123000_errebot_identity_confirmation.sql')
          s = p.read_text()
          s = s.replace('select constraint.conname', 'select c.conname')
          s = s.replace('from pg_constraint as constraint', 'from pg_constraint as c')
          s = s.replace('where constraint.conrelid', 'where c.conrelid')
          s = s.replace('and constraint.contype', 'and c.contype')
          s = s.replace('pg_get_constraintdef(constraint.oid)', 'pg_get_constraintdef(c.oid)')
          p.write_text(s)
          PY
          grep -q "select c.conname" supabase/migrations/20260831123000_errebot_identity_confirmation.sql
          ! grep -q "pg_constraint as constraint" supabase/migrations/20260831123000_errebot_identity_confirmation.sql
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr125-fix-confirmation-sql-alias.yml
          git add supabase/migrations/20260831123000_errebot_identity_confirmation.sql
          git commit -m "fix(tournaments): avoid reserved SQL alias in Errebot confirmation"
          git push
