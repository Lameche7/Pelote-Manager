name: Format PR 456 automatically
on:
  push:
    branches: [feat/tournament-admin-tracking]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/layouts/MainLayout.css src/features/admin/championships/pages/AdminChampionshipResultsPage.tsx src/features/admin/championships/services/championshipOfficialResultsSyncService.ts src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/layouts/MainLayout.css src/features/admin/championships/pages/AdminChampionshipResultsPage.tsx src/features/admin/championships/services/championshipOfficialResultsSyncService.ts src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier to failing files'
            git push origin HEAD:feat/tournament-admin-tracking
          fi
