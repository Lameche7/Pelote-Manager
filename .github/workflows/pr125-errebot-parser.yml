name: PR125 Errebot structured parser

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add positioned PDF layout reconstruction
        shell: bash
        run: |
          cat > src/features/admin/tournaments/domain/errebotPdfLayout.ts <<'EOF'
          export type ErrebotPdfTextItem = {
            text: string;
            x: number;
            y: number;
            width: number;
          };

          const ROW_TOLERANCE = 1.5;
          const COLUMN_GAP = 12;

          type Row = {
            y: number;
            items: ErrebotPdfTextItem[];
          };

          const cleanItemText = (value: string) =>
            value.replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();

          export const reconstructErrebotPdfRows = (
            sourceItems: ErrebotPdfTextItem[],
          ) => {
            const items = sourceItems
              .map((item) => ({
                ...item,
                text: cleanItemText(item.text),
                width: Math.max(0, item.width),
              }))
              .filter((item) => item.text)
              .sort((left, right) => right.y - left.y || left.x - right.x);

            const rows: Row[] = [];
            for (const item of items) {
              const current = rows.at(-1);
              if (!current || Math.abs(current.y - item.y) > ROW_TOLERANCE) {
                rows.push({ y: item.y, items: [item] });
              } else {
                current.items.push(item);
              }
            }

            return rows
              .map((row) => {
                const rowItems = [...row.items].sort(
                  (left, right) => left.x - right.x,
                );
                let output = "";
                let previousEnd: number | null = null;

                for (const item of rowItems) {
                  if (previousEnd === null) {
                    output = item.text;
                  } else {
                    const gap = item.x - previousEnd;
                    output += `${gap > COLUMN_GAP ? "\t" : " "}${item.text}`;
                  }
                  previousEnd = item.x + item.width;
                }
                return output.trim();
              })
              .filter(Boolean)
              .join("\n");
          };
          EOF

      - name: Add Errebot v1 parser
        shell: bash
        run: |
          cat > src/features/admin/tournaments/domain/errebotParser.ts <<'EOF'
          export const ERREBOT_PARSER_VERSION = "errebot-pdf-v1";

          export type ErrebotSeriesName =
            | "1re Série"
            | "2me Série"
            | "3me Série"
            | "4me Série"
            | "Féminines";

          export type ErrebotPlayer = {
            firstName: string;
            lastName: string;
            phone: string;
          };

          export type ErrebotTeam = {
            externalId: string;
            series: ErrebotSeriesName;
            players: [ErrebotPlayer, ErrebotPlayer];
          };

          export type ErrebotPool = {
            series: ErrebotSeriesName;
            name: string;
            teamExternalIds: string[];
          };

          export type ErrebotFixture = {
            date: string;
            time: string;
            series: ErrebotSeriesName;
            pool: string;
            team1ExternalId: string;
            team2ExternalId: string;
            score1: number | null;
            score2: number | null;
          };

          export type ErrebotParseIssue = {
            severity: "error" | "warning";
            code: string;
            message: string;
          };

          export type ErrebotSeriesSummary = {
            series: ErrebotSeriesName;
            teamCount: number;
            poolCount: number;
            fixtureCount: number;
          };

          export type ErrebotTournamentParseResult = {
            parserVersion: string;
            teams: ErrebotTeam[];
            pools: ErrebotPool[];
            fixtures: ErrebotFixture[];
            emptySlotCount: number;
            poolSize3Count: number;
            series: ErrebotSeriesSummary[];
            issues: ErrebotParseIssue[];
          };

          const SERIES_ORDER: ErrebotSeriesName[] = [
            "1re Série",
            "2me Série",
            "3me Série",
            "4me Série",
            "Féminines",
          ];

          const fold = (value: string) =>
            value
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/\s+/g, " ")
              .trim();

          const normalizeSeries = (value: string): ErrebotSeriesName | null => {
            const normalized = fold(value);
            if (["1re serie", "1ere serie", "1ere serie"].includes(normalized)) {
              return "1re Série";
            }
            if (["2me serie", "2eme serie", "2e serie"].includes(normalized)) {
              return "2me Série";
            }
            if (["3me serie", "3eme serie", "3e serie"].includes(normalized)) {
              return "3me Série";
            }
            if (["4me serie", "4eme serie", "4e serie"].includes(normalized)) {
              return "4me Série";
            }
            if (normalized === "feminines") return "Féminines";
            return null;
          };

          const cellsFromLine = (line: string) =>
            line
              .replace(/\u00a0/g, " ")
              .split(/\t+/)
              .map((cell) => cell.replace(/\s+/g, " ").trim())
              .filter(Boolean);

          const externalIdFromCell = (value: string) => {
            const match = value.match(/^(\d{3})\b/);
            return match?.[1] ?? null;
          };

          const phoneLooksUsable = (value: string) =>
            value.replace(/\D/g, "").length >= 8;

          const parseDateTime = (cells: string[]) => {
            const combined = cells[0]?.match(
              /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})$/,
            );
            if (combined) {
              return {
                date: `${combined[3]}-${combined[2]}-${combined[1]}`,
                time: combined[4],
                nextIndex: 1,
              };
            }

            const date = cells[0]?.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            const time = cells[1]?.match(/^\d{2}:\d{2}$/);
            if (!date || !time) return null;
            return {
              date: `${date[3]}-${date[2]}-${date[1]}`,
              time: time[0],
              nextIndex: 2,
            };
          };

          const pairKey = (left: string, right: string) =>
            [left, right].sort().join("|");

          const poolKey = (series: ErrebotSeriesName, pool: string) =>
            `${series}|${pool}`;

          export const parseErrebotTournament = (
            sourceText: string,
          ): ErrebotTournamentParseResult => {
            const lines = sourceText
              .replace(/\r/g, "")
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);
            const issues: ErrebotParseIssue[] = [];
            const teamMap = new Map<string, ErrebotTeam>();
            const poolMap = new Map<string, ErrebotPool>();

            for (const line of lines) {
              const cells = cellsFromLine(line);
              const externalId = cells[0]?.match(/^\d{3}$/)?.[0];
              const series = normalizeSeries(cells[1] ?? "");
              if (!externalId || !series || cells.length < 8) continue;
              if (!phoneLooksUsable(cells[4]) || !phoneLooksUsable(cells[7])) {
                continue;
              }

              const team: ErrebotTeam = {
                externalId,
                series,
                players: [
                  {
                    firstName: cells[2],
                    lastName: cells[3],
                    phone: cells[4],
                  },
                  {
                    firstName: cells[5],
                    lastName: cells[6],
                    phone: cells[7],
                  },
                ],
              };

              const previous = teamMap.get(externalId);
              if (previous) {
                issues.push({
                  severity: "error",
                  code: "duplicate_team_id",
                  message: `L’identifiant d’équipe ${externalId} apparaît plusieurs fois.`,
                });
              } else {
                teamMap.set(externalId, team);
              }
            }

            for (const line of lines) {
              const cells = cellsFromLine(line);
              const series = normalizeSeries(cells[0] ?? "");
              const pool = cells[1] ?? "";
              if (!series || !/^[A-Z]$/.test(pool)) continue;

              const teamExternalIds = cells
                .slice(2)
                .map(externalIdFromCell)
                .filter((value): value is string => value !== null);
              if (teamExternalIds.length < 3 || teamExternalIds.length > 6) {
                continue;
              }

              const key = poolKey(series, pool);
              const previous = poolMap.get(key);
              if (!previous) {
                poolMap.set(key, { series, name: pool, teamExternalIds });
              } else if (
                previous.teamExternalIds.join("|") !== teamExternalIds.join("|")
              ) {
                issues.push({
                  severity: "error",
                  code: "conflicting_pool",
                  message: `La poule ${pool} de ${series} présente deux compositions différentes.`,
                });
              }
            }

            const fixtures: ErrebotFixture[] = [];
            let emptySlotCount = 0;
            for (const line of lines) {
              const cells = cellsFromLine(line);
              const dateTime = parseDateTime(cells);
              if (!dateTime) continue;

              const series = normalizeSeries(cells[dateTime.nextIndex] ?? "");
              const pool = cells[dateTime.nextIndex + 1] ?? "";
              if (!series || !/^[A-Z]$/.test(pool)) {
                emptySlotCount += 1;
                continue;
              }

              const detailCells = cells.slice(dateTime.nextIndex + 2);
              const refs = detailCells
                .map((cell, index) => ({
                  index,
                  externalId: externalIdFromCell(cell),
                }))
                .filter(
                  (ref): ref is { index: number; externalId: string } =>
                    ref.externalId !== null && teamMap.has(ref.externalId),
                );

              if (refs.length < 2) {
                emptySlotCount += 1;
                continue;
              }
              if (refs.length > 2) {
                issues.push({
                  severity: "error",
                  code: "ambiguous_fixture",
                  message: `Un créneau de ${series} ${pool} contient plus de deux équipes reconnues.`,
                });
                continue;
              }

              const scoreValues = detailCells
                .slice(refs[0].index + 1, refs[1].index)
                .filter((cell) => /^\d+$/.test(cell))
                .map(Number);

              fixtures.push({
                date: dateTime.date,
                time: dateTime.time,
                series,
                pool,
                team1ExternalId: refs[0].externalId,
                team2ExternalId: refs[1].externalId,
                score1: scoreValues[0] ?? null,
                score2: scoreValues[1] ?? null,
              });
            }

            const teams = [...teamMap.values()].sort(
              (left, right) => Number(left.externalId) - Number(right.externalId),
            );
            const pools = [...poolMap.values()].sort((left, right) => {
              const seriesDelta =
                SERIES_ORDER.indexOf(left.series) - SERIES_ORDER.indexOf(right.series);
              return seriesDelta || left.name.localeCompare(right.name, "fr");
            });

            if (teams.length === 0) {
              issues.push({
                severity: "error",
                code: "no_teams",
                message: "Aucune équipe Errebot n’a été reconnue dans le PDF.",
              });
            }
            if (pools.length === 0) {
              issues.push({
                severity: "error",
                code: "no_pools",
                message: "Aucune poule Errebot n’a été reconnue dans le PDF.",
              });
            }

            const assignmentCounts = new Map<string, number>();
            for (const pool of pools) {
              for (const externalId of pool.teamExternalIds) {
                if (!teamMap.has(externalId)) {
                  issues.push({
                    severity: "error",
                    code: "pool_unknown_team",
                    message: `La poule ${pool.name} de ${pool.series} référence l’équipe ${externalId}, absente du registre.`,
                  });
                }
                assignmentCounts.set(
                  externalId,
                  (assignmentCounts.get(externalId) ?? 0) + 1,
                );
              }
            }
            for (const team of teams) {
              const assignmentCount = assignmentCounts.get(team.externalId) ?? 0;
              if (assignmentCount !== 1) {
                issues.push({
                  severity: "error",
                  code: "team_pool_assignment",
                  message:
                    assignmentCount === 0
                      ? `L’équipe ${team.externalId} n’est affectée à aucune poule.`
                      : `L’équipe ${team.externalId} est affectée à plusieurs poules.`,
                });
              }
            }

            const fixturesByPool = new Map<string, ErrebotFixture[]>();
            for (const fixture of fixtures) {
              const key = poolKey(fixture.series, fixture.pool);
              const parsedPool = poolMap.get(key);
              if (!parsedPool) {
                issues.push({
                  severity: "error",
                  code: "fixture_unknown_pool",
                  message: `Un match référence la poule ${fixture.pool} de ${fixture.series}, absente de la répartition.`,
                });
                continue;
              }
              if (
                !parsedPool.teamExternalIds.includes(fixture.team1ExternalId) ||
                !parsedPool.teamExternalIds.includes(fixture.team2ExternalId)
              ) {
                issues.push({
                  severity: "error",
                  code: "fixture_team_mismatch",
                  message: `Un match de la poule ${fixture.pool} de ${fixture.series} contient une équipe hors poule.`,
                });
              }
              fixturesByPool.set(key, [
                ...(fixturesByPool.get(key) ?? []),
                fixture,
              ]);
            }

            for (const parsedPool of pools) {
              const key = poolKey(parsedPool.series, parsedPool.name);
              const expectedPairs = new Set<string>();
              parsedPool.teamExternalIds.forEach((left, index) => {
                parsedPool.teamExternalIds.slice(index + 1).forEach((right) => {
                  expectedPairs.add(pairKey(left, right));
                });
              });
              const actualFixtures = fixturesByPool.get(key) ?? [];
              const actualPairs = new Set(
                actualFixtures.map((fixture) =>
                  pairKey(
                    fixture.team1ExternalId,
                    fixture.team2ExternalId,
                  ),
                ),
              );

              if (actualFixtures.length !== actualPairs.size) {
                issues.push({
                  severity: "error",
                  code: "duplicate_fixture",
                  message: `La poule ${parsedPool.name} de ${parsedPool.series} contient un match en doublon.`,
                });
              }
              const missingCount = [...expectedPairs].filter(
                (pair) => !actualPairs.has(pair),
              ).length;
              const extraCount = [...actualPairs].filter(
                (pair) => !expectedPairs.has(pair),
              ).length;
              if (missingCount > 0 || extraCount > 0) {
                issues.push({
                  severity: "error",
                  code: "fixture_set_mismatch",
                  message: `Le calendrier de la poule ${parsedPool.name} de ${parsedPool.series} est incohérent (${missingCount} match(s) manquant(s), ${extraCount} inattendu(s)).`,
                });
              }
            }

            const series = SERIES_ORDER.map((seriesName) => ({
              series: seriesName,
              teamCount: teams.filter((team) => team.series === seriesName).length,
              poolCount: pools.filter((pool) => pool.series === seriesName).length,
              fixtureCount: fixtures.filter(
                (fixture) => fixture.series === seriesName,
              ).length,
            })).filter(
              (summary) =>
                summary.teamCount > 0 ||
                summary.poolCount > 0 ||
                summary.fixtureCount > 0,
            );

            return {
              parserVersion: ERREBOT_PARSER_VERSION,
              teams,
              pools,
              fixtures,
              emptySlotCount,
              poolSize3Count: pools.filter(
                (pool) => pool.teamExternalIds.length === 3,
              ).length,
              series,
              issues,
            };
          };
          EOF

      - name: Make PDF.js preserve rows and columns
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/admin/tournaments/domain/errebotPdfExtraction.ts")
          text = path.read_text(encoding="utf-8")
          text = 'import { reconstructErrebotPdfRows } from "./errebotPdfLayout";\n\n' + text
          old = '''      const text = content.items
                .flatMap((item) => ("str" in item ? [item.str] : []))
                .join(" ")
                .replace(/[\\t ]+/g, " ")
                .trim();
              pages.push(text);'''
          new = '''      const text = reconstructErrebotPdfRows(
                content.items.flatMap((item) =>
                  "str" in item && item.str.trim()
                    ? [
                        {
                          text: item.str,
                          x: item.transform[4],
                          y: item.transform[5],
                          width: item.width,
                        },
                      ]
                    : [],
                ),
              );
              pages.push(text);'''
          if text.count(old) != 1:
              raise SystemExit("PDF extraction anchor not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Add structured parser summary to the preview
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx")
          text = path.read_text(encoding="utf-8")
          import_anchor = 'import {\n  extractErrebotPdfText,\n  sha256File,\n} from "@/features/admin/tournaments/domain/errebotPdfExtraction";\n'
          import_add = import_anchor + 'import {\n  parseErrebotTournament,\n  type ErrebotTournamentParseResult,\n} from "@/features/admin/tournaments/domain/errebotParser";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit("Import page import anchor not found")
          text = text.replace(import_anchor, import_add, 1)

          state_anchor = '  const [preview, setPreview] = useState<ErrebotExtractionPreview | null>(null);\n'
          state_add = state_anchor + '  const [parsed, setParsed] = useState<ErrebotTournamentParseResult | null>(null);\n'
          if text.count(state_anchor) != 1:
              raise SystemExit("Import page state anchor not found")
          text = text.replace(state_anchor, state_add, 1)

          text = text.replace(
              '    setPreview(null);\n    setError("");\n    setStep(1);',
              '    setPreview(null);\n    setParsed(null);\n    setError("");\n    setStep(1);',
              1,
          )
          text = text.replace(
              '    setPreview(null);\n    const validationError',
              '    setPreview(null);\n    setParsed(null);\n    const validationError',
              1,
          )

          analyse_anchor = '''      setPreview(nextPreview);
                setStep(3);'''
          analyse_add = '''      const nextParsed = parseErrebotTournament(extracted.text);
                setPreview(nextPreview);
                setParsed(nextParsed);
                setStep(3);'''
          if text.count(analyse_anchor) != 1:
              raise SystemExit("Import page analyse anchor not found")
          text = text.replace(analyse_anchor, analyse_add, 1)

          condition_anchor = '      {step === 3 && selected && preview && (\n'
          condition_add = '      {step === 3 && selected && preview && parsed && (\n'
          if text.count(condition_anchor) != 1:
              raise SystemExit("Import page step 3 condition not found")
          text = text.replace(condition_anchor, condition_add, 1)

          summary_old = '''          <div className="admin-card admin-tournament-import__summary">
                      <div>
                        <strong>{preview.pageCount}</strong>
                        <span>page{preview.pageCount > 1 ? "s" : ""}</span>
                      </div>
                      <div>
                        <strong>{preview.lineCount}</strong>
                        <span>lignes utiles</span>
                      </div>
                      <div>
                        <strong>{preview.characterCount}</strong>
                        <span>caractères extraits</span>
                      </div>
                    </div>
          '''
          summary_new = '''          <div className="admin-card admin-tournament-import__summary">
                      <div>
                        <strong>{parsed.teams.length}</strong>
                        <span>équipes</span>
                      </div>
                      <div>
                        <strong>{parsed.pools.length}</strong>
                        <span>poules</span>
                      </div>
                      <div>
                        <strong>{parsed.poolSize3Count}</strong>
                        <span>poules de 3</span>
                      </div>
                      <div>
                        <strong>{parsed.fixtures.length}</strong>
                        <span>matchs</span>
                      </div>
                      <div>
                        <strong>{parsed.emptySlotCount}</strong>
                        <span>créneaux libres</span>
                      </div>
                    </div>

                    <div className="admin-card admin-tournament-import__card">
                      <div>
                        <h2>Structure détectée</h2>
                        <p>
                          Parser {parsed.parserVersion} · {preview.pageCount} page
                          {preview.pageCount > 1 ? "s" : ""} · {preview.lineCount} lignes utiles.
                        </p>
                      </div>
                      <div className="admin-tournament-import__table-wrap">
                        <table className="admin-tournament-import__table">
                          <thead>
                            <tr>
                              <th>Série</th>
                              <th>Équipes</th>
                              <th>Poules</th>
                              <th>Matchs</th>
                            </tr>
                          </thead>
                          <tbody>
                            {parsed.series.map((series) => (
                              <tr key={series.series}>
                                <td>{series.series}</td>
                                <td>{series.teamCount}</td>
                                <td>{series.poolCount}</td>
                                <td>{series.fixtureCount}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      {parsed.issues.length === 0 ? (
                        <p className="admin-tournament-import__success">
                          Structure cohérente : chaque équipe appartient à une seule poule et le calendrier couvre exactement les confrontations attendues.
                        </p>
                      ) : (
                        <div className="admin-tournament-import__issues" role="alert">
                          <strong>{parsed.issues.length} anomalie(s) détectée(s)</strong>
                          <ul>
                            {parsed.issues.slice(0, 10).map((issue, index) => (
                              <li key={`${issue.code}-${index}`}>{issue.message}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
          '''
          if text.count(summary_old) != 1:
              raise SystemExit("Import page summary block not found")
          text = text.replace(summary_old, summary_new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Extend import preview styles
        shell: bash
        run: |
          cat >> src/features/admin/tournaments/pages/AdminTournamentImportPage.css <<'EOF'

          .admin-tournament-import__table-wrap {
            overflow-x: auto;
          }

          .admin-tournament-import__table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
          }

          .admin-tournament-import__table th,
          .admin-tournament-import__table td {
            border-bottom: 1px solid rgb(107 114 128 / 14%);
            padding: 0.6rem 0.7rem;
            text-align: left;
          }

          .admin-tournament-import__table th {
            font-size: 0.72rem;
            text-transform: uppercase;
            opacity: 0.62;
          }

          .admin-tournament-import__success {
            border-radius: 0.75rem;
            padding: 0.75rem 0.85rem;
            background: rgb(22 101 52 / 9%);
            color: #166534;
            font-weight: 750;
          }

          .admin-tournament-import__issues {
            border-radius: 0.75rem;
            padding: 0.75rem 0.85rem;
            background: rgb(178 37 37 / 9%);
            color: #8b1f1f;
          }

          .admin-tournament-import__issues ul {
            margin: 0.5rem 0 0;
            padding-left: 1.25rem;
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/admin/tournaments/pages/AdminTournamentImportPage.css")
          text = path.read_text(encoding="utf-8")
          old = "  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 0.75rem;\n}\n\n.admin-tournament-import__summary > div"
          new = "  grid-template-columns: repeat(5, minmax(0, 1fr));\n  gap: 0.75rem;\n}\n\n.admin-tournament-import__summary > div"
          if text.count(old) != 1:
              raise SystemExit("Summary grid anchor not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Add parser and layout tests
        shell: bash
        run: |
          cat > tests/tournamentErrebotParser.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { reconstructErrebotPdfRows } from "../.test-dist/src/features/admin/tournaments/domain/errebotPdfLayout.js";
          import { parseErrebotTournament } from "../.test-dist/src/features/admin/tournaments/domain/errebotParser.js";

          test("la reconstruction PDF conserve les lignes et les colonnes", () => {
            const text = reconstructErrebotPdfRows([
              { text: "100", x: 10, y: 700, width: 12 },
              { text: "1re", x: 40, y: 700, width: 12 },
              { text: "Série", x: 53, y: 700, width: 20 },
              { text: "Jean", x: 95, y: 700, width: 18 },
              { text: "Claude", x: 115, y: 700, width: 25 },
              { text: "Dupont", x: 165, y: 700, width: 25 },
              { text: "101", x: 10, y: 685, width: 12 },
              { text: "1re Série", x: 40, y: 685, width: 33 },
            ]);

            assert.equal(
              text,
              "100\t1re Série\tJean Claude\tDupont\n101\t1re Série",
            );
          });

          const team = (id, series, first1, last1, first2, last2) =>
            [
              id,
              series,
              first1,
              last1,
              "0600000001",
              first2,
              last2,
              "0600000002",
            ].join("\t");

          const poolTeam = (id, label) => `${id} ${label}`;

          test("le parseur reconstruit équipes, poules, matchs et créneaux libres", () => {
            const source = [
              team("100", "1re Série", "Alice", "Alpha", "Bob", "Bravo"),
              team("101", "1re Série", "Chloe", "Charlie", "Dan", "Delta"),
              team("102", "1re Série", "Emma", "Echo", "Fred", "Foxtrot"),
              team("200", "2me Série", "Gina", "Golf", "Hugo", "Hotel"),
              team("201", "2me Série", "Iris", "India", "Jules", "Juliett"),
              team("202", "2me Série", "Kara", "Kilo", "Leo", "Lima"),
              team("203", "2me Série", "Mona", "Mike", "Noe", "November"),
              [
                "1re Série",
                "A",
                poolTeam("100", "ALPHA - BRAVO"),
                poolTeam("101", "CHARLIE - DELTA"),
                poolTeam("102", "ECHO - FOXTROT"),
              ].join("\t"),
              [
                "2me Série",
                "A",
                poolTeam("200", "GOLF - HOTEL"),
                poolTeam("201", "INDIA - JULIETT"),
                poolTeam("202", "KILO - LIMA"),
                poolTeam("203", "MIKE - NOVEMBER"),
              ].join("\t"),
              "01/09/2026 18:30\t1re Série\tA\t100 ALPHA - BRAVO\t101 CHARLIE - DELTA",
              "02/09/2026 18:30\t1re Série\tA\t100 ALPHA - BRAVO\t102 ECHO - FOXTROT",
              "03/09/2026 18:30\t1re Série\tA\t101 CHARLIE - DELTA\t102 ECHO - FOXTROT",
              "04/09/2026 18:30\t2me Série\tA\t200 GOLF - HOTEL\t201 INDIA - JULIETT",
              "05/09/2026 18:30\t2me Série\tA\t200 GOLF - HOTEL\t202 KILO - LIMA",
              "06/09/2026 18:30\t2me Série\tA\t200 GOLF - HOTEL\t203 MIKE - NOVEMBER",
              "07/09/2026 18:30\t2me Série\tA\t201 INDIA - JULIETT\t202 KILO - LIMA",
              "08/09/2026 18:30\t2me Série\tA\t201 INDIA - JULIETT\t203 MIKE - NOVEMBER",
              "09/09/2026 18:30\t2me Série\tA\t202 KILO - LIMA\t203 MIKE - NOVEMBER",
              "10/09/2026 18:30",
            ].join("\n");

            const parsed = parseErrebotTournament(source);
            assert.equal(parsed.teams.length, 7);
            assert.equal(parsed.pools.length, 2);
            assert.equal(parsed.poolSize3Count, 1);
            assert.equal(parsed.fixtures.length, 9);
            assert.equal(parsed.emptySlotCount, 1);
            assert.deepEqual(parsed.issues, []);
            assert.deepEqual(parsed.series, [
              { series: "1re Série", teamCount: 3, poolCount: 1, fixtureCount: 3 },
              { series: "2me Série", teamCount: 4, poolCount: 1, fixtureCount: 6 },
            ]);
          });

          test("le parseur détecte un calendrier incomplet", () => {
            const source = [
              team("100", "1re Série", "Alice", "Alpha", "Bob", "Bravo"),
              team("101", "1re Série", "Chloe", "Charlie", "Dan", "Delta"),
              team("102", "1re Série", "Emma", "Echo", "Fred", "Foxtrot"),
              "1re Série\tA\t100 ALPHA - BRAVO\t101 CHARLIE - DELTA\t102 ECHO - FOXTROT",
              "01/09/2026 18:30\t1re Série\tA\t100 ALPHA - BRAVO\t101 CHARLIE - DELTA",
            ].join("\n");
            const parsed = parseErrebotTournament(source);
            assert.ok(
              parsed.issues.some((issue) => issue.code === "fixture_set_mismatch"),
            );
          });

          test("le parseur récupère deux scores lorsqu'ils sont présents", () => {
            const source = [
              team("100", "1re Série", "Alice", "Alpha", "Bob", "Bravo"),
              team("101", "1re Série", "Chloe", "Charlie", "Dan", "Delta"),
              team("102", "1re Série", "Emma", "Echo", "Fred", "Foxtrot"),
              "1re Série\tA\t100 ALPHA - BRAVO\t101 CHARLIE - DELTA\t102 ECHO - FOXTROT",
              "01/09/2026 18:30\t1re Série\tA\t100 ALPHA - BRAVO\t15\t10\t101 CHARLIE - DELTA",
              "02/09/2026 18:30\t1re Série\tA\t100 ALPHA - BRAVO\t102 ECHO - FOXTROT",
              "03/09/2026 18:30\t1re Série\tA\t101 CHARLIE - DELTA\t102 ECHO - FOXTROT",
            ].join("\n");
            const parsed = parseErrebotTournament(source);
            assert.equal(parsed.fixtures[0].score1, 15);
            assert.equal(parsed.fixtures[0].score2, 10);
          });
          EOF

      - name: Compile parser modules in test build
        shell: python
        run: |
          from pathlib import Path
          path = Path("tsconfig.test.json")
          text = path.read_text(encoding="utf-8")
          anchor = '    "src/features/admin/tournaments/domain/errebotImportPreview.ts",\n'
          addition = (
              anchor
              + '    "src/features/admin/tournaments/domain/errebotPdfLayout.ts",\n'
              + '    "src/features/admin/tournaments/domain/errebotParser.ts",\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit("tsconfig test anchor not found")
          path.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

      - run: npx prettier --write src/features/admin/tournaments/domain/errebotPdfLayout.ts src/features/admin/tournaments/domain/errebotParser.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css tests/tournamentErrebotParser.test.mjs tsconfig.test.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified parser and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/domain/errebotPdfLayout.ts src/features/admin/tournaments/domain/errebotParser.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css tests/tournamentErrebotParser.test.mjs tsconfig.test.json
          git rm .github/workflows/pr125-errebot-parser.yml
          git commit -m "feat(tournaments): parse Errebot tournament structure"
          git push origin HEAD:agent/errebot-import-foundation
