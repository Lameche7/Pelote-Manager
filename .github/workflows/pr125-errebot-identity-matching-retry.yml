name: PR125 Errebot identity matching retry

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Recover generation steps with NodeNext import fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path(".github/workflows/pr125-errebot-identity-matching.yml")
          source = source_path.read_text(encoding="utf-8")
          source = source.replace(
              'from "./errebotParser";',
              'from "./errebotParser.js";',
          )

          names = [
              "Add secure Errebot identity matching RPC",
              "Add Errebot identity matching domain helper",
              "Add Errebot import service",
              "Extend Errebot import assistant with matching preview",
              "Extend Errebot import styles",
              "Add Errebot identity matching tests",
              "Compile identity helper in test build",
          ]

          for index, name in enumerate(names, start=1):
              marker = f"      - name: {name}\n"
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f"Missing workflow step: {name}")
              run_marker = "        run: |\n"
              run_start = source.find(run_marker, start)
              if run_start < 0:
                  raise SystemExit(f"Missing run block: {name}")
              body_start = run_start + len(run_marker)
              next_step = source.find("\n      - ", body_start)
              body_end = len(source) if next_step < 0 else next_step + 1
              body = source[body_start:body_end]
              lines = []
              for line in body.splitlines():
                  if line.startswith("          "):
                      lines.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f"Unexpected indentation in step: {name}")
                  else:
                      lines.append("")
              Path(f"/tmp/pr125-step-{index}.sh").write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )
          PY

      - run: bash /tmp/pr125-step-1.sh
      - run: bash /tmp/pr125-step-2.sh
      - run: bash /tmp/pr125-step-3.sh
      - run: bash /tmp/pr125-step-4.sh
      - run: bash /tmp/pr125-step-5.sh
      - run: bash /tmp/pr125-step-6.sh
      - run: bash /tmp/pr125-step-7.sh

      - name: Format touched files
        run: >-
          npx prettier --write
          .github/workflows/pr125-errebot-identity-matching.yml
          .github/workflows/pr125-errebot-identity-matching-retry.yml
          src/features/admin/tournaments/domain/errebotIdentityMatching.ts
          src/features/admin/tournaments/services/errebotImportService.ts
          src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx
          src/features/admin/tournaments/pages/AdminTournamentImportPage.css
          tests/tournamentErrebotIdentityMatching.test.mjs
          tsconfig.test.json

      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified identity matching and clean one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr125-errebot-identity-matching.yml \
            .github/workflows/pr125-errebot-identity-matching-retry.yml
          git add \
            supabase/migrations/20260831113000_errebot_identity_matching.sql \
            src/features/admin/tournaments/domain/errebotIdentityMatching.ts \
            src/features/admin/tournaments/services/errebotImportService.ts \
            src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx \
            src/features/admin/tournaments/pages/AdminTournamentImportPage.css \
            tests/tournamentErrebotIdentityMatching.test.mjs \
            tsconfig.test.json
          git commit -m "feat(tournaments): preview Errebot identity matches"
          git push origin HEAD:agent/errebot-import-foundation
