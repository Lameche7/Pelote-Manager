name: Formatage - diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-diagnostics.yml"
      - ".prettierignore"
      - "package.json"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: List files needing formatting
        id: prettier
        shell: bash
        run: |
          set +e
          npm run format:check 2>&1 | tee prettier-report.txt
          result=${PIPESTATUS[0]}
          printf 'PRETTIER_EXIT=%s\n' "$result" >> "$GITHUB_ENV"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostic
          path: prettier-report.txt
          retention-days: 14
      - name: Fail if formatting differs
        run: exit "$PRETTIER_EXIT"
