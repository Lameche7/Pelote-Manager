name: Format reservation team labels test
on:
  push:
    branches: [feat/ordinary-booking-team-labels-live]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ordinary-booking-team-labels-live
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/ordinaryReservationTeamLabels.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ordinaryReservationTeamLabels.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(reservations): format team label test"
            git push origin HEAD:feat/ordinary-booking-team-labels-live
          fi
