name: Temporary PR134 hardening

on:
  push:
    branches:
      - agent/championship-core

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-core
      - name: Keep account deletion compatible with imported player history
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260904211000_add_championship_core.sql")
          text = path.read_text()
          old = """  check (\n    (profile_id is null and link_status = 'unlinked')\n    or (profile_id is not null and link_status <> 'unlinked')\n  )\n"""
          new = """  check (profile_id is null or link_status <> 'unlinked')\n"""
          if old not in text:
              raise SystemExit("expected championship player link constraint not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260904211000_add_championship_core.sql
          git commit -m "fix(championship): keep player history deletable"
          git push
