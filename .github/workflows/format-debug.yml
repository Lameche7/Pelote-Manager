name: Format debug

on:
  push:
    branches:
      - feat/archive-championship-button

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/admin/championships/components/ChampionshipResultSettingsCard.tsx src/features/admin/championships/pages/AdminChampionshipsPage.tsx
          git diff -- src/features/admin/championships/components/ChampionshipResultSettingsCard.tsx src/features/admin/championships/pages/AdminChampionshipsPage.tsx
