name: Temporary tournament result SQL hotfix

on:
  push:
    branches:
      - fix/tournament-result-planning-into

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournament-result-planning-into

      - name: Patch migration and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20260814130000_add_tournament_result_engine.sql")
          text = migration.read_text()
          old = '''  select planning, resource.timezone
  into target_planning, target_timezone
  from public.tournament_match_planning as planning
  join public.reservable_resources as resource on resource.id = planning.resource_id
  where planning.match_id = target_match.id;
'''
          new = '''  select planning.*
  into target_planning
  from public.tournament_match_planning as planning
  where planning.match_id = target_match.id;

  select resource.timezone
  into target_timezone
  from public.reservable_resources as resource
  where resource.id = target_planning.resource_id;
'''
          if old not in text:
              raise SystemExit("offending planning INTO block not found")
          text = text.replace(old, new, 1)
          migration.write_text(text)

          test_file = Path("tests/tournamentResults.test.mjs")
          tests = test_file.read_text()
          anchor = '  assert.match(migration, /target_planning\\.ends_at/);\n'
          addition = anchor + '''  assert.match(migration, /select planning\\.\\*[\\s\\S]*into target_planning/);\n  assert.match(migration, /select resource\\.timezone[\\s\\S]*into target_timezone/);\n  assert.doesNotMatch(migration, /into target_planning,\\s*target_timezone/);\n'''
          if 'assert.doesNotMatch(migration, /into target_planning' not in tests:
              if anchor not in tests:
                  raise SystemExit("result timing assertion anchor not found")
              tests = tests.replace(anchor, addition, 1)
          test_file.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write supabase/migrations/20260814130000_add_tournament_result_engine.sql tests/tournamentResults.test.mjs

      - name: Result tests
        run: node --test tests/tournamentResults.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-fix-tournament-result-planning-into.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(tournaments): split composite planning INTO"
          git push origin HEAD:fix/tournament-result-planning-into
