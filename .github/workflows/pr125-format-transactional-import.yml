name: PR125 format transactional import

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format transactional import files
        run: |
          npx prettier --write \
            src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx \
            src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.css \
            src/features/admin/tournaments/domain/errebotTransactionalImport.ts \
            src/features/admin/tournaments/services/errebotImportService.ts \
            src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx \
            tests/tournamentErrebotTransactionalImport.test.mjs
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr125-format-transactional-import.yml
          git add src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx \
            src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.css \
            src/features/admin/tournaments/domain/errebotTransactionalImport.ts \
            src/features/admin/tournaments/services/errebotImportService.ts \
            src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx \
            tests/tournamentErrebotTransactionalImport.test.mjs
          git commit -m "style(tournaments): format transactional Errebot import"
          git push origin HEAD:agent/errebot-import-foundation
