name: Temporary sporting rules null guard

on:
  push:
    branches: [feature/tournament-sporting-rules]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-sporting-rules

      - name: Guard sporting rules rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/features/admin/tournaments/pages/AdminTournamentsPage.tsx")
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)<TournamentSportingRulesSection\s+'
              r'rules=\{sportingRules!\}\s+'
              r'disabled=\{!sportingRules \|\| !sportingRulesEditable \|\| saving\}\s+'
              r'onChange=\{setSportingRules\}\s+'
              r'onSave=\{\(\) => void saveSportingRules\(\)\}\s*/>',
              re.S,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit("sporting rules render anchor not found")

          indent = match.group("indent")
          replacement = (
              f"{indent}{{sportingRules && (\n"
              f"{indent}  <TournamentSportingRulesSection\n"
              f"{indent}    rules={{sportingRules}}\n"
              f"{indent}    disabled={{!sportingRulesEditable || saving}}\n"
              f"{indent}    onChange={{setSportingRules}}\n"
              f"{indent}    onSave={{() => void saveSportingRules()}}\n"
              f"{indent}  />\n"
              f"{indent})}}"
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          PY

      - name: Verify
        run: |
          npm install --package-lock=false
          npx prettier --write src/features/admin/tournaments/pages/AdminTournamentsPage.tsx
          npm run typecheck
          npm test

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/pages/AdminTournamentsPage.tsx
          git diff --cached --quiet || git commit -m "fix(tournaments): guard sporting rules loading state"
          git push origin HEAD:feature/tournament-sporting-rules
