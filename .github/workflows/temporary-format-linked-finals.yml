name: Temporary formatting for linked finals
on:
  push:
    branches:
      - fix/imported-team-finals-availability-access-20261113
    paths:
      - .github/workflows/temporary-format-linked-finals.yml
permissions:
  contents: write
jobs:
  format-linked-finals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imported-team-finals-availability-access-20261113
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: |
          npx prettier --write src/features/tournaments/pages/TournamentDetailPage.tsx src/features/tournaments/components/TournamentFinalsAvailabilityEditor.tsx src/features/tournaments/services/tournamentService.ts src/features/user-space/tournaments/pages/MyTournamentsPage.tsx src/features/tournaments/types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournaments/pages/TournamentDetailPage.tsx src/features/tournaments/components/TournamentFinalsAvailabilityEditor.tsx src/features/tournaments/services/tournamentService.ts src/features/user-space/tournaments/pages/MyTournamentsPage.tsx src/features/tournaments/types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format imported finals availability fix"
            git push origin HEAD:fix/imported-team-finals-availability-access-20261113
          fi
