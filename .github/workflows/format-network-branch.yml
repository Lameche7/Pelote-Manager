name: Temporary Network Format Patch

on:
  push:
    branches:
      - feature/global-player-identity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format known files
        run: |
          npx prettier --write \
            src/features/admin/tournaments/components/TournamentSportingRulesSection.tsx \
            src/features/tv/tvWakeLock.ts \
            src/features/user-space/statistics/domain/championshipStatistics.ts \
            src/features/user-space/statistics/pages/MyStatisticsPage.tsx \
            src/features/user-space/statistics/services/myTournamentStatisticsService.ts \
            tests/globalPlayerIdentityFoundation.test.mjs \
            tests/myStatistics.test.mjs \
            tests/tvModeSettings.test.mjs \
            tests/viewportStability.test.mjs
          git diff --binary > prettier.patch
      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-network-patch
          path: prettier.patch
          if-no-files-found: error
