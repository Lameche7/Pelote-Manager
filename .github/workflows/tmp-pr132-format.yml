name: Temporary PR132 formatter

on:
  push:
    branches:
      - agent/profile-linked-tournament-permissions

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-linked-tournament-permissions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/tournamentProfileLinkedPermissions.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/tournamentProfileLinkedPermissions.test.mjs
          git diff --cached --quiet || git commit -m "style(auth): format tournament permission tests"
          git push
