name: Format tournament results once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-format-tournament-results.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournament-results-unprogrammed-visibility-20261015
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx
      - run: |
          npm run format:check
          npm run typecheck
          npm run test
          git diff --check
      - name: Commit only formatted TSX
        run: |
          if git diff --quiet -- src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/pages/AdminTournamentResultsPage.tsx
          git commit -m "style: format tournament results panel"
          git pull --rebase origin feat/tournament-results-unprogrammed-visibility-20261015
          git push origin HEAD:feat/tournament-results-unprogrammed-visibility-20261015
