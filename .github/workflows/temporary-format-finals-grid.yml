name: Temporary finals grid format
on:
  push:
    branches:
      - feat/finals-availability-after-registration-20261113
    paths:
      - .github/workflows/temporary-format-finals-grid.yml
permissions:
  contents: write
jobs:
  format-finals-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finals-availability-after-registration-20261113
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply project formatting
        run: |
          npx prettier --write src/features/tournaments/components/TournamentAvailabilityGrid.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournaments/components/TournamentAvailabilityGrid.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format finals-only availability grid"
            git push origin HEAD:feat/finals-availability-after-registration-20261113
          fi
