name: LiveKit SDK lock diagnostic (temporary)
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/livekit-sdk-lock-diagnostic.yml
jobs:
  lock-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic lock for pinned browser SDK
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=readFileSync("package-lock.json"); process.stdout.write("SDK_LOCK_BEGIN:" + p.toString("base64") + ":SDK_LOCK_END\\n");'
