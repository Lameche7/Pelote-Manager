name: PR125 Errebot preview retry

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install pdfjs-dist --save

      - name: Reuse the verified file-generation block
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          source = Path(".github/workflows/pr125-errebot-preview-codemod.yml").read_text(encoding="utf-8")
          match = re.search(
              r"      - name: Add local PDF extraction and preview\n"
              r"        shell: bash\n"
              r"        run: \|\n"
              r"(?P<body>.*?)"
              r"(?=\n      - name: Wire the assistant into admin navigation)",
              source,
              re.S,
          )
          if not match:
              raise SystemExit("Unable to recover the preview generation block")
          Path("/tmp/pr125-add-preview.sh").write_text(
              textwrap.dedent(match.group("body")),
              encoding="utf-8",
          )

      - run: bash /tmp/pr125-add-preview.sh

      - name: Wire the assistant into admin navigation
        shell: python
        run: |
          from pathlib import Path

          routes = Path("src/shared/config/routes.ts")
          text = routes.read_text(encoding="utf-8")
          anchor = '  adminTournaments: "/admin/tournois",\n'
          addition = anchor + '  adminTournamentImport: "/admin/tournois/importer",\n'
          if text.count(anchor) != 1:
              raise SystemExit("routes.ts anchor not found exactly once")
          routes.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          permissions = Path("src/features/admin/config/adminPermissions.ts")
          text = permissions.read_text(encoding="utf-8")
          anchor = (
              '        to: ROUTES.adminTournaments,\n'
              '        permission: ADMIN_PERMISSIONS.tournaments,\n'
              '      },\n'
          )
          addition = anchor + (
              '      {\n'
              '        label: "Importer Errebot",\n'
              '        to: ROUTES.adminTournamentImport,\n'
              '        permission: ADMIN_PERMISSIONS.tournaments,\n'
              '      },\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit("adminPermissions.ts anchor not found exactly once")
          permissions.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          router = Path("src/app/router.tsx")
          text = router.read_text(encoding="utf-8")
          import_anchor = 'import { AdminTournamentPlanningPage } from "@/features/admin/tournaments/pages/AdminTournamentPlanningPage";\n'
          import_addition = 'import { AdminTournamentImportPage } from "@/features/admin/tournaments/pages/AdminTournamentImportPage";\n' + import_anchor
          if text.count(import_anchor) != 1:
              raise SystemExit("router import anchor not found exactly once")
          text = text.replace(import_anchor, import_addition, 1)

          route_anchor = '          {\n            path: "tournois/equipes",\n'
          route_addition = (
              '          {\n'
              '            path: "tournois/importer",\n'
              '            element: permitted(\n'
              '              ADMIN_PERMISSIONS.tournaments,\n'
              '              <AdminTournamentImportPage />,\n'
              '            ),\n'
              '          },\n'
              + route_anchor
          )
          if text.count(route_anchor) != 1:
              raise SystemExit("router route anchor not found exactly once")
          router.write_text(text.replace(route_anchor, route_addition, 1), encoding="utf-8")

      - run: npx prettier --write src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs package.json package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified preview assistant and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/features/admin/tournaments/domain/errebotImportPreview.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css src/shared/config/routes.ts src/features/admin/config/adminPermissions.ts src/app/router.tsx tests/tournamentErrebotImportPreview.test.mjs
          git rm .github/workflows/pr125-errebot-preview-codemod.yml .github/workflows/pr125-errebot-preview-retry.yml
          git commit -m "feat(tournaments): preview Errebot PDFs locally"
          git push origin HEAD:agent/errebot-import-foundation
