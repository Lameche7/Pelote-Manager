name: CI formatting cleanup 331

on:
  push:
    branches:
      - chore/ci-baseline-cleanup-331

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: chore/ci-baseline-cleanup-331
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier format
        run: npm run format
      - name: Commit only formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'All files already formatted.'
          else
            git commit -m 'style: normalize existing Prettier formatting (#331)'
            git push origin HEAD:chore/ci-baseline-cleanup-331
          fi
