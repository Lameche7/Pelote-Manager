name: Format PR145

on:
  push:
    branches:
      - agent/marketing-site-domain-split

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/marketing-site-domain-split
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format targeted files
        run: >-
          npx prettier --write
          src/features/marketing/pages/MarketingPage.css
          src/features/marketing/pages/MarketingPage.tsx
          src/main.tsx
          tests/marketingDomainSplit.test.mjs
          src/features/user-space/championships/pages/MyChampionshipsPage.tsx
          tests/notificationDismissal.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/marketing/pages/MarketingPage.css src/features/marketing/pages/MarketingPage.tsx src/main.tsx tests/marketingDomainSplit.test.mjs src/features/user-space/championships/pages/MyChampionshipsPage.tsx tests/notificationDismissal.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: format PR145 files"
            git push origin HEAD:agent/marketing-site-domain-split
          fi
