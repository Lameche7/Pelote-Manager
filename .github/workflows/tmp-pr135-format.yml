name: Temporary PR135 formatter

on:
  push:
    branches:
      - agent/championship-source-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/championship-source-import
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/championships/domain/championshipSourceImport.ts src/features/admin/championships/services/championshipSourceFileService.ts tests/championshipSourceImport.test.mjs tsconfig.test.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/championships/domain/championshipSourceImport.ts src/features/admin/championships/services/championshipSourceFileService.ts tests/championshipSourceImport.test.mjs tsconfig.test.json
          git commit -m "style(championship): format source import"
          git push
