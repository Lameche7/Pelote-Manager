name: Format PR 497 files once

on:
  push:
    branches:
      - feat/superadmin-club-switcher
    paths:
      - .github/workflows/format-pr497-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only the seven files flagged by CI
        run: |
          npx prettier --write \
            src/features/admin/access/adminAccessService.ts \
            src/features/admin/access/clubSelection.ts \
            src/features/platform/pages/PlatformDashboardPage.tsx \
            tests/adminAccessMultiClub.test.mjs \
            tests/clubSelection.test.mjs \
            tests/explicitClubPermissionGuard.test.mjs \
            tests/platformClubSelector.test.mjs
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/features/admin/access/adminAccessService.ts \
            src/features/admin/access/clubSelection.ts \
            src/features/platform/pages/PlatformDashboardPage.tsx \
            tests/adminAccessMultiClub.test.mjs \
            tests/clubSelection.test.mjs \
            tests/explicitClubPermissionGuard.test.mjs \
            tests/platformClubSelector.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to PR 497 files"
            git push origin HEAD:feat/superadmin-club-switcher
          fi
