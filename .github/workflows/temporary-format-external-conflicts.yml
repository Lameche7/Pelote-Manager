name: Temporary format external tournament conflicts
on:
  push:
    branches:
      - feat/external-tournament-fixture-conflicts-20261113
    paths:
      - .github/workflows/temporary-format-external-conflicts.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-tournament-fixture-conflicts-20261113
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed source files
        run: |
          npx prettier --write src/features/tournaments/components/TournamentAvailabilityGrid.tsx src/features/tournaments/components/TournamentFinalsAvailabilityEditor.tsx src/features/tournaments/services/tournamentService.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tournaments/components/TournamentAvailabilityGrid.tsx src/features/tournaments/components/TournamentFinalsAvailabilityEditor.tsx src/features/tournaments/services/tournamentService.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format external tournament conflict UI"
            git push origin HEAD:feat/external-tournament-fixture-conflicts-20261113
          fi
