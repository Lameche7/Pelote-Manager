name: PR127 wire Errebot availability import

on:
  push:
    branches:
      - agent/tournament-rescheduling
    paths:
      - .github/workflows/pr127-wire-errebot-availability.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tournament-rescheduling

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire component into teams page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/admin/tournaments/pages/AdminTournamentTeamsPage.tsx")
          text = path.read_text()

          import_anchor = 'import { AdminTournamentPlayerFields } from "@/features/admin/tournaments/components/AdminTournamentPlayerFields";\n'
          import_line = 'import { AdminErrebotAvailabilityImport } from "@/features/admin/tournaments/components/AdminErrebotAvailabilityImport";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          jsx_anchor = '''          {data && (\n            <div className="admin-tournament-teams__series">'''
          jsx_insert = '''          {data && (\n            <AdminErrebotAvailabilityImport\n              tournamentId={selectedId}\n              onImported={reloadSelected}\n            />\n          )}\n\n          {data && (\n            <div className="admin-tournament-teams__series">'''
          if '<AdminErrebotAvailabilityImport' not in text:
              if jsx_anchor not in text:
                  raise SystemExit("jsx anchor not found")
              text = text.replace(jsx_anchor, jsx_insert, 1)

          path.write_text(text)
          PY
          npx prettier --write \
            src/features/admin/tournaments/pages/AdminTournamentTeamsPage.tsx \
            src/features/admin/tournaments/components/AdminErrebotAvailabilityImport.tsx \
            src/features/admin/tournaments/components/AdminErrebotAvailabilityImport.css \
            src/features/admin/tournaments/domain/errebotAvailabilityImport.ts \
            src/features/admin/tournaments/services/adminErrebotAvailabilityImportService.ts
          rm .github/workflows/pr127-wire-errebot-availability.yml

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(tournaments): expose Errebot availability import" || exit 0
          git push origin HEAD:agent/tournament-rescheduling
