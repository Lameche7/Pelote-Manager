name: PR191 format

on:
  push:
    branches:
      - fix/imported-tournament-series-colors

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/imported-tournament-series-colors
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Format PR191 files
        run: >-
          npx prettier --write
          src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx
          src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx
          src/features/admin/tournaments/services/adminTournamentPublicationService.ts
          src/features/tv/pages/TvDisplayPage.tsx
          src/features/tv/services/tvDisplayService.ts
          tests/tournamentSeriesColorFlow.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/components/ErrebotTournamentImportFinalize.tsx \
            src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx \
            src/features/admin/tournaments/services/adminTournamentPublicationService.ts \
            src/features/tv/pages/TvDisplayPage.tsx \
            src/features/tv/services/tvDisplayService.ts \
            tests/tournamentSeriesColorFlow.test.mjs
          git commit -m "chore(format): prettier PR191"
          git push origin HEAD:fix/imported-tournament-series-colors
