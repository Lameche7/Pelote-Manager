name: PR125 format conflict resolution

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format conflict resolution files
        run: >-
          npx prettier --write
          src/features/admin/tournaments/services/adminTournamentPublicationService.ts
          src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx
          src/features/admin/tournaments/pages/AdminTournamentPublicationPage.css
          tests/tournamentPublicationConflictResolution.test.mjs
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/pr125-format-conflict-resolution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/services/adminTournamentPublicationService.ts
          git add src/features/admin/tournaments/pages/AdminTournamentPublicationPage.tsx
          git add src/features/admin/tournaments/pages/AdminTournamentPublicationPage.css
          git add tests/tournamentPublicationConflictResolution.test.mjs
          git add .github/workflows/pr125-format-conflict-resolution.yml
          git commit -m "style(tournaments): format conflict resolution"
          git push
