name: PR125 Errebot structured parser retry

on:
  push:
    branches:
      - agent/errebot-import-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/errebot-import-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recover parser generation steps
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          source = Path(".github/workflows/pr125-errebot-parser.yml").read_text(encoding="utf-8")

          def extract(name: str, destination: str):
              pattern = (
                  rf"      - name: {re.escape(name)}\n"
                  rf"        shell: (?:bash|python)\n"
                  rf"        run: \|\n"
                  rf"(?P<body>.*?)"
                  rf"(?=\n      - name:|\n      - run:)"
              )
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f"Unable to recover step: {name}")
              Path(destination).write_text(textwrap.dedent(match.group("body")), encoding="utf-8")

          extract("Add positioned PDF layout reconstruction", "/tmp/add-layout.sh")
          extract("Add Errebot v1 parser", "/tmp/add-parser.sh")
          extract("Add structured parser summary to the preview", "/tmp/update-preview.py")
          extract("Extend import preview styles", "/tmp/update-preview-styles.sh")
          extract("Add parser and layout tests", "/tmp/add-parser-tests.sh")
          extract("Compile parser modules in test build", "/tmp/update-test-tsconfig.py")

      - run: bash /tmp/add-layout.sh
      - run: bash /tmp/add-parser.sh

      - name: Make PDF.js preserve rows and columns
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/features/admin/tournaments/domain/errebotPdfExtraction.ts")
          text = path.read_text(encoding="utf-8")
          import_line = 'import { reconstructErrebotPdfRows } from "./errebotPdfLayout";\n\n'
          if not text.startswith(import_line):
              text = import_line + text

          pattern = re.compile(
              r"(?P<indent>\s*)const text = content\.items\n"
              r".*?"
              r"(?P=indent)pages\.push\(text\);",
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("Unable to locate the current PDF text extraction block")
          indent = match.group("indent")
          inner = indent + "  "
          replacement = (
              f'{indent}const text = reconstructErrebotPdfRows(\n'
              f'{inner}content.items.flatMap((item) =>\n'
              f'{inner}  "str" in item && item.str.trim()\n'
              f'{inner}    ? [\n'
              f'{inner}        {{\n'
              f'{inner}          text: item.str,\n'
              f'{inner}          x: item.transform[4],\n'
              f'{inner}          y: item.transform[5],\n'
              f'{inner}          width: item.width,\n'
              f'{inner}        }},\n'
              f'{inner}      ]\n'
              f'{inner}    : [],\n'
              f'{inner}),\n'
              f'{indent});\n'
              f'{indent}pages.push(text);'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one PDF extraction replacement, got {count}")
          path.write_text(text, encoding="utf-8")

      - run: python /tmp/update-preview.py
      - run: bash /tmp/update-preview-styles.sh
      - run: bash /tmp/add-parser-tests.sh
      - run: python /tmp/update-test-tsconfig.py

      - run: npx prettier --write src/features/admin/tournaments/domain/errebotPdfLayout.ts src/features/admin/tournaments/domain/errebotParser.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css tests/tournamentErrebotParser.test.mjs tsconfig.test.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run format:check

      - name: Commit verified parser and clean one-shot workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/tournaments/domain/errebotPdfLayout.ts src/features/admin/tournaments/domain/errebotParser.ts src/features/admin/tournaments/domain/errebotPdfExtraction.ts src/features/admin/tournaments/pages/AdminTournamentImportPage.tsx src/features/admin/tournaments/pages/AdminTournamentImportPage.css tests/tournamentErrebotParser.test.mjs tsconfig.test.json
          git rm .github/workflows/pr125-errebot-parser.yml .github/workflows/pr125-errebot-parser-retry.yml
          git commit -m "feat(tournaments): parse Errebot tournament structure"
          git push origin HEAD:agent/errebot-import-foundation
