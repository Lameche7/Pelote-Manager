name: Dependency audit fix (temporary)

on:
  push:
    branches: [security/npm-audit-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: security/npm-audit-fix

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les correctifs npm compatibles
        run: npm audit fix

      - name: Vérifier le résultat
        run: npm audit --audit-level=low

      - name: Enregistrer le lockfile corrigé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "fix(security): remediate npm audit vulnerabilities"
            git push origin HEAD:security/npm-audit-fix
          fi
