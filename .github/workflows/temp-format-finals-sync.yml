name: One-time finals sync formatting
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-finals-sync.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/championship-final-fixtures-auto-sync-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write api/championship-results-source.mjs supabase/functions/championship-official-sync/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/championship-results-source.mjs supabase/functions/championship-official-sync/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format final fixture parser and sync"
          git pull --rebase origin feat/championship-final-fixtures-auto-sync-20261019
          git push origin HEAD:feat/championship-final-fixtures-auto-sync-20261019
