name: Format Pilotoki Live prototype
on:
  push:
    branches:
      - feat/pilotoki-live-media-bridge
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilotoki-live-media-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write api/live-bridge-session.mjs services/live-bridge/README.md services/live-bridge/server.mjs src/features/admin/live/components/PilotokiLiveTestStudio.tsx src/features/admin/live/services/liveBridgeService.ts tests/pilotokiLiveBridge.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/live-bridge-session.mjs services/live-bridge/README.md services/live-bridge/server.mjs src/features/admin/live/components/PilotokiLiveTestStudio.tsx src/features/admin/live/services/liveBridgeService.ts tests/pilotokiLiveBridge.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(live): format prototype source"
            git push origin HEAD:feat/pilotoki-live-media-bridge
          fi
