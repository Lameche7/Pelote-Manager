name: Temporary fix tournament creation full configuration

on:
  push:
    branches:
      - fix/tournament-create-full-config

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournament-create-full-config
          fetch-depth: 0

      - name: Patch full tournament creation flow
        shell: python
        run: |
          from pathlib import Path

          page_path = Path('src/features/admin/tournaments/pages/AdminTournamentsPage.tsx')
          page = page_path.read_text(encoding='utf-8')

          page = page.replace(
              '<form className="tournament-form" onSubmit={submitGeneral}>',
              '<form\n              id="tournament-general-form"\n              className="tournament-form"\n              onSubmit={submitGeneral}\n            >',
              1,
          )

          old_else = '''      } else {
        if (!sportingRules) {
          throw new Error("Configurez les règles sportives du tournoi.");
        }
        const id = await tournamentAdminService.create(draft);
        await tournamentAdminService.saveSportingRules(id, sportingRules);
        await loadList();
        await openTournament(id);
        setMessage(
          "Tournoi créé avec ses règles sportives. Configurez maintenant les terrains, séries et horaires.",
        );
      }'''
          new_else = '''      } else {
        if (!sportingRules) {
          throw new Error("Configurez les règles sportives du tournoi.");
        }
        if (resourceIds.length === 0) {
          throw new Error("Sélectionnez au moins un terrain.");
        }
        const activeSeries = series.filter((item) => item.enabled);
        if (
          activeSeries.length === 0 ||
          activeSeries.some((item) => !item.name.trim() || item.capacity <= 0)
        ) {
          throw new Error(
            "Configurez au moins une série active avec un nom et une capacité positive.",
          );
        }
        if (
          playWindows.length === 0 ||
          playWindows.some(
            (item) =>
              !item.opensAt || !item.closesAt || item.opensAt >= item.closesAt,
          )
        ) {
          throw new Error("Configurez au moins une plage horaire valide.");
        }
        const id = await tournamentAdminService.create(draft);
        await tournamentAdminService.saveSportingRules(id, sportingRules);
        await tournamentAdminService.saveConfiguration(id, {
          resourceIds,
          series,
          playWindows,
        });
        await loadList();
        await openTournament(id);
        setMessage(
          "Tournoi créé avec ses règles sportives, terrains, séries et horaires.",
        );
      }'''
          if old_else not in page:
              raise SystemExit('creation block not found')
          page = page.replace(old_else, new_else, 1)

          old_create_button = '''              {!detail && (
                <button
                  className="tournaments-primary"
                  type="submit"
                  disabled={saving}
                >
                  Créer le tournoi
                </button>
              )}
            </form>

            {detail && (
              <>
                {sportingRules && (
                  <TournamentSportingRulesSection
                    rules={sportingRules}

                    disabled={!sportingRulesEditable || saving}

                    onChange={setSportingRules}

                    onSave={() => void saveSportingRules()}
                  />
                )}

                <section className="tournament-config">'''
          new_create_button = '''            </form>

            {detail && sportingRules && (
              <TournamentSportingRulesSection
                rules={sportingRules}
                disabled={!sportingRulesEditable || saving}
                onChange={setSportingRules}
                onSave={() => void saveSportingRules()}
              />
            )}

            <section className="tournament-config">'''
          if old_create_button not in page:
              raise SystemExit('post-form detail wrapper start not found')
          page = page.replace(old_create_button, new_create_button, 1)

          old_lifecycle_start = '''                {editable && (
                  <div className="tournament-config-save">
                    <button
                      className="tournaments-primary"
                      type="button"
                      disabled={saving}
                      onClick={() => void saveConfiguration()}
                    >
                      Enregistrer terrains, séries et horaires
                    </button>
                  </div>
                )}

                <section className="tournament-lifecycle">
                  <h3>7. Cycle du tournoi</h3>'''
          new_lifecycle_start = '''            {detail && editable && (
              <div className="tournament-config-save">
                <button
                  className="tournaments-primary"
                  type="button"
                  disabled={saving}
                  onClick={() => void saveConfiguration()}
                >
                  Enregistrer terrains, séries et horaires
                </button>
              </div>
            )}

            {!detail && (
              <div className="tournament-config-save">
                <button
                  className="tournaments-primary"
                  type="submit"
                  form="tournament-general-form"
                  disabled={saving}
                >
                  Créer le tournoi
                </button>
              </div>
            )}

            {detail && (
              <section className="tournament-lifecycle">
                <h3>7. Cycle du tournoi</h3>'''
          if old_lifecycle_start not in page:
              raise SystemExit('lifecycle start not found')
          page = page.replace(old_lifecycle_start, new_lifecycle_start, 1)

          old_tail = '''                </section>
              </>
            )}
          </div>'''
          new_tail = '''              </section>
            )}
          </div>'''
          if old_tail not in page:
              raise SystemExit('detail wrapper tail not found')
          page = page.replace(old_tail, new_tail, 1)

          page_path.write_text(page, encoding='utf-8')

          test_path = Path('tests/tournamentSportingRules.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = '''  assert.match(service, /saveSportingRules/);\n});\n'''
          addition = '''  assert.match(service, /saveSportingRules/);\n});\n\ntest("la création du tournoi inclut aussi terrains, séries et horaires", async () => {\n  const page = await read(\n    "../src/features/admin/tournaments/pages/AdminTournamentsPage.tsx",\n  );\n\n  assert.match(page, /<h3>4\\. Terrains<\\/h3>/);\n  assert.match(page, /<h3>5\\. Séries & capacités<\\/h3>/);\n  assert.match(page, /<h3>6\\. Horaires des créneaux<\\/h3>/);\n  assert.match(page, /form="tournament-general-form"/);\n  assert.match(page, /saveConfiguration\\(id, \\{/);\n  assert.match(page, /Sélectionnez au moins un terrain/);\n  assert.match(page, /Configurez au moins une série active/);\n  assert.match(page, /Configurez au moins une plage horaire valide/);\n});\n'''
          if marker not in test:
              raise SystemExit('test marker not found')
          test = test.replace(marker, addition, 1)
          test_path.write_text(test, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write src/features/admin/tournaments/pages/AdminTournamentsPage.tsx tests/tournamentSportingRules.test.mjs

      - name: Sporting rules tests
        run: node --test tests/tournamentSportingRules.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-tournament-create-full-config.yml
          git add src/features/admin/tournaments/pages/AdminTournamentsPage.tsx tests/tournamentSportingRules.test.mjs
          git commit -m "fix(tournaments): inclure toute la configuration à la création"
          git push origin HEAD:fix/tournament-create-full-config
