name: Temporary slot exchange formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-format-slot-exchange.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-slot-exchange-full-tournament-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/admin/reservations/pages/AdminSlotExchangePage.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/reservations/pages/AdminSlotExchangePage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format full tournament exchange view"
          git pull --rebase origin feat/admin-slot-exchange-full-tournament-20261020
          git push origin HEAD:feat/admin-slot-exchange-full-tournament-20261020
