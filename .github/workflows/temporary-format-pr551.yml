name: Temporary formatting PR 551
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/finals-manual-auto-publication-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx \
            src/features/admin/tournaments/services/tournamentFinalStageAdminService.ts \
            src/features/reservations/components/CalendarFinalsAdminPanel.tsx \
            tests/calendarFinalsDirectPlanning.test.mjs
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-format-pr551.yml
          git add src/features/admin/tournaments/components/AdminTournamentFinalFullPlanning.tsx src/features/admin/tournaments/services/tournamentFinalStageAdminService.ts src/features/reservations/components/CalendarFinalsAdminPanel.tsx tests/calendarFinalsDirectPlanning.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format manual final publication changes'
          git push origin HEAD:fix/finals-manual-auto-publication-20261118
