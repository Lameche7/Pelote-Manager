name: Build Supabase SQL bundle

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*.sql'
      - '.github/workflows/build-supabase-sql-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SQL bundle
        shell: bash
        run: |
          output="supabase/ALL_MIGRATIONS.sql"
          : > "$output"
          for file in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            printf '\n-- ============================================================\n' >> "$output"
            printf -- '-- %s\n' "$(basename "$file")" >> "$output"
            printf -- '-- ============================================================\n\n' >> "$output"
            cat "$file" >> "$output"
            printf '\n' >> "$output"
          done

      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- supabase/ALL_MIGRATIONS.sql; then
            echo "Bundle already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/ALL_MIGRATIONS.sql
          git commit -m "chore: générer le script SQL complet Supabase"
          git push
