name: Temporary PR131 licence guard

on:
  push:
    branches:
      - agent/profile-identity-links

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-identity-links
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harden licence guard
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/features/user-space/profile/pages/MyProfilePage.tsx")
          text = page.read_text()
          text = text.replace(
              "const hasLinkedLicence = Boolean(profile.memberId && member);",
              "const hasLinkedLicence = Boolean(profile.memberId);",
          )
          text = text.replace(
              ': hasLinkedLicence\n      ? "Licence inactive"\n      : "Utilisateur non licencié";',
              ': hasLinkedLicence\n      ? member\n        ? "Licence inactive"\n        : "Licence liée"\n      : "Utilisateur non licencié";',
          )
          page.write_text(text)

          test_file = Path("tests/profileIdentityLinks.test.mjs")
          test_text = test_file.read_text().replace(
              "assert.match(profilePage, /profile\\.memberId && member/);",
              "assert.match(profilePage, /Boolean\\(profile\\.memberId\\)/);",
          )
          test_file.write_text(test_text)
          PY
          npx prettier --write \
            src/features/user-space/profile/pages/MyProfilePage.tsx \
            tests/profileIdentityLinks.test.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/user-space/profile/pages/MyProfilePage.tsx tests/profileIdentityLinks.test.mjs
          git diff --cached --quiet || git commit -m "fix(profile): prevent duplicate licence link action"
          git push
